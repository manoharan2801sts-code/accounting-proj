<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Cash & Bank Book — TRAVEL AGENCY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="assets/css/design-system.css" rel="stylesheet" />
  <link href="assets/css/app.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <style>
    /* Locked to the viewport - only the table body scrolls, not the whole
       page (same pattern as report-trial-balance.html/report-day-book.html/
       report-dsr-airline-booking.html). */
    html, body { height: 100%; overflow: hidden; margin: 0; }
    .cb-main {
      display: flex; flex-direction: column;
      height: calc(100vh - var(--topnav-height) - var(--menubar-height, 0px));
      box-sizing: border-box;
    }
    .cb-main .page-header-row { flex-shrink: 0; }
    .cb-main .table-container { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .table-scroll { flex: 1; min-height: 0; overflow: auto; }
    .table-custom thead th { position: sticky; top: 0; z-index: 1; }

    .page-header-row { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; }
    /* Same clickable trail as report-ledger-book.html - "Reports" has no
       landing page of its own so it's plain text, current page is
       underlined to mark "you are here". */
    .rpt-breadcrumb { font-size: 0.8rem; color: var(--color-text-muted); display: flex; align-items: center; gap: 0.4rem; }
    .rpt-breadcrumb a { color: var(--color-primary); text-decoration: none; }
    .rpt-breadcrumb a:hover { text-decoration: underline; }
    .rpt-breadcrumb .rpt-breadcrumb-current { color: var(--color-primary); font-weight: 700; text-decoration: underline; text-decoration-color: var(--color-primary); text-underline-offset: 3px; }

    /* Compact single-row toolbar (From/To/Apply on the left, Print/Export
       CSV pushed to the far right via the margin-left:auto spacer) - same
       pattern as report-trial-balance.html. */
    .rpt-toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; width: 100%; }
    .rpt-toolbar-label { font-size: 11px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em; }
    .rpt-toolbar-date { height: 26px; width: 116px; padding: 0 6px; font-size: 12px; box-sizing: border-box; }

    .table-container {
      background: var(--color-white); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); overflow: hidden;
    }
    .cb-head {
      padding: 0.5rem 1rem; border-bottom: 1px solid var(--color-border);
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
      flex-shrink: 0;
    }
    .cb-head .cb-title { font-size: 0.78rem; font-weight: 700; color: var(--color-text-dark); }
    .cb-head .cb-range { font-size: 11px; font-weight: 400; color: var(--color-text-muted); margin-left: 0.5rem; }
    .cb-head .rpt-search { max-width: 220px; width: 100%; height: 26px; font-size: 11.5px; padding: 0 0.5rem; }

    .table-custom { width: 100%; border-collapse: collapse; text-align: left; }
    .table-custom th { padding: 0.35rem 0.8rem; background: #F8FAFC; border-bottom: 1px solid var(--color-border);
      font-size: 10px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em; }
    .table-custom td {
      padding: 0.55rem 0.85rem; border-bottom: 1px solid var(--color-border-subtle);
      font-size: 12.5px; color: var(--color-text); vertical-align: middle;
    }
    .table-custom tbody tr:last-child td { border-bottom: none; }
    .table-custom tbody tr.cb-ledger-row { cursor: pointer; }
    .table-custom tbody tr.cb-ledger-row.cb-row-selected td { background: var(--color-primary); color: #FFFFFF; }
    .table-custom tbody tr.cb-ledger-row td:first-child { padding-left: 2rem; font-style: italic; color: var(--color-text-dark); }
    .table-custom tbody tr.cb-group-row td { background: var(--color-white); font-weight: 700; color: var(--color-text-dark); }
    .table-custom tbody tr.cb-group-row td:first-child { font-weight: 700; }

    .cb-grand-total-row td { border-top: 2px solid var(--color-border); font-weight: 800; font-size: 13.5px; background: #FAFBFD; }

    .amt { font-family: var(--font-mono); font-weight: 600; text-align: right; }
    th.amt-header { text-align: right; }
  </style>
</head>
<body>
  <header class="app-topnav" id="shell-topnav"></header>
  <div class="app-body">
    <main class="app-main cb-main" style="max-width: 1440px; margin: 0 auto; padding: 1.5rem 2rem; width: 100%;">
      <div class="page-header-row">
        <div class="rpt-breadcrumb" id="rpt-breadcrumb"></div>
        <div class="rpt-toolbar">
          <span class="rpt-toolbar-label">From</span>
          <input type="date" class="form-control-custom rpt-toolbar-date" id="filter-from" />
          <span class="rpt-toolbar-label">To</span>
          <input type="date" class="form-control-custom rpt-toolbar-date" id="filter-to" />
          <button type="button" class="dom-nav-btn btn-primary" onclick="loadCashBankBook()">Apply</button>
          <span style="margin-left:auto;"></span>
          <button type="button" class="dom-nav-btn" onclick="window.print()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2m-12 0v4h12v-4"/></svg>
            Print
          </button>
          <button type="button" class="dom-nav-btn btn-primary" onclick="exportCSV()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4m14-7l-5 5-5-5m5 5V3"/></svg>
            Export CSV
          </button>
        </div>
      </div>

      <div class="table-container">
        <div class="cb-head">
          <div class="cb-title">Cash &amp; Bank Summary <span class="cb-range" id="cb-date-range"></span></div>
          <input type="text" class="form-control-custom rpt-search" placeholder="Search records..." oninput="filterTable(this.value)" />
        </div>
        <div class="table-scroll">
          <table class="table-custom" id="main-data-table">
            <thead>
              <tr>
                <th>Particulars</th>
                <th class="amt-header">Debit</th>
                <th class="amt-header">Credit</th>
              </tr>
            </thead>
            <tbody id="main-data-tbody">
              <tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api.js?v=3"></script>
  <script src="assets/js/hardcode.js"></script>
  <script src="assets/js/util.js?v=2"></script>
  <script src="assets/js/shell.js?v=21"></script>
  <script>
    // Not gated on DOMContentLoaded - this page's <script> can be injected
    // by the app's SPA navigation (shell.js's navigateTo) into a document
    // that already finished loading, so DOMContentLoaded never fires again
    // and this would silently never run except on a hard refresh.
    //
    // Wrapped in an IIFE (unlike a naive top-level script) because
    // shell.js re-executes this exact block every time this page is
    // navigated to - a second execution's top-level `let`/`const` in the
    // SAME document throws "Identifier has already been declared" (a
    // classic-script global lexical environment persists across separately
    // executed <script> tags), which silently aborts the whole block and
    // leaves the page stuck on its static "Loading..." forever until a
    // hard refresh starts the document fresh. Functions the page's own
    // onclick="..." attributes call are exposed on window explicitly,
    // since they're no longer implicitly global once wrapped.
    (function () {
    let activeCompanyId;

    (async function init() {
      try {
        const active = await VoyagerShell.init({ activeKey: "rep-cash-bank-book" });
        if (active) activeCompanyId = Number(active.id);
        await VoyagerUtil.loadDecimalPlaces(activeCompanyId);
      } catch (err) {
        console.error("Shell init failed", err);
      }
      // Defaults to today, not a wide/blank range - this project posts a
      // lot of data per day, so leaving these blank (or a wide range)
      // would be slow/overwhelming to load on first open.
      const todayStr = new Date().toISOString().slice(0, 10);
      document.getElementById("filter-from").value = todayStr;
      document.getElementById("filter-to").value = todayStr;
      renderBreadcrumb();
      await loadCashBankBook();
    })();

    // "Reports" has no landing page of its own (plain dropdown trigger),
    // so it's shown as plain text, not a link - same convention as
    // report-ledger-book.html. A future drill-down arrival (from/
    // from_url params) would insert that origin page as its own
    // clickable segment in between, same as Ledger already does.
    function escHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function renderBreadcrumb() {
      const params = new URLSearchParams(window.location.search);
      const from = params.get("from");
      const fromUrl = params.get("from_url");
      const el = document.getElementById("rpt-breadcrumb");
      const parts = [`<span>Reports</span>`];
      if (from && fromUrl) {
        parts.push(`<span>&rsaquo;</span>`, `<a href="${escHtml(fromUrl)}">${escHtml(from)}</a>`);
      }
      parts.push(`<span>&rsaquo;</span>`, `<span class="rpt-breadcrumb-current">Cash &amp; Bank Summary</span>`);
      el.innerHTML = parts.join(" ");
    }

    function fmtAmt(n) {
      const v = Number(n) || 0;
      const d = VoyagerUtil.getDecimalPlaces();
      return Math.abs(v).toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    function fmtDateDisplay(iso) {
      if (!iso) return "";
      const d = new Date(iso + "T00:00:00");
      if (isNaN(d)) return iso;
      return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
    }

    async function loadCashBankBook() {
      const tbody = document.getElementById("main-data-tbody");
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">Loading...</td></tr>`;

      const fromDate = document.getElementById("filter-from").value;
      const toDate = document.getElementById("filter-to").value;
      let params = `company_id=${activeCompanyId}`;
      if (fromDate) params += `&from_date=${fromDate}`;
      if (toDate) params += `&to_date=${toDate}`;

      try {
        const res = await fetch(`http://localhost:8000/api/cash-bank-book/?${params}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Server returned ${res.status}`);

        const rangeFrom = data.from_date ? fmtDateDisplay(data.from_date) : "Beginning";
        const rangeTo = data.to_date ? fmtDateDisplay(data.to_date) : "Date";
        document.getElementById("cb-date-range").textContent = data.from_date && data.from_date === data.to_date
          ? rangeFrom : `${rangeFrom} to ${rangeTo}`;

        renderTable(data);
      } catch (err) {
        console.error("Could not load the cash & bank book - is the Django backend running?", err);
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">Could not load data. Is the Django backend running on localhost:8000?</td></tr>`;
      }
    }

    function navigateToLedger(row) {
      const from = encodeURIComponent("Cash & Bank Summary");
      const fromUrl = encodeURIComponent(window.location.href);
      window.location.href = `report-ledger-monthly.html?ledger_id=${row.dataset.ledgerId}&from=${from}&from_url=${fromUrl}`;
    }

    function renderTable(data) {
      const tbody = document.getElementById("main-data-tbody");
      selectedRowIndex = -1; // stale after a full re-render - rows are new DOM nodes
      if (!data.groups.length) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">No Cash-in-Hand or Bank Accounts ledgers found.</td></tr>`;
        return;
      }

      let rows = "";
      data.groups.forEach((g) => {
        const gDebit = g.closing_balance >= 0 ? fmtAmt(g.closing_balance) : "-";
        const gCredit = g.closing_balance < 0 ? fmtAmt(g.closing_balance) : "-";
        rows += `
          <tr class="cb-group-row">
            <td>${g.group_name}</td>
            <td class="amt">${gDebit}</td>
            <td class="amt">${gCredit}</td>
          </tr>`;
        g.ledgers.forEach((l) => {
          const lDebit = l.closing_balance >= 0 ? fmtAmt(l.closing_balance) : "-";
          const lCredit = l.closing_balance < 0 ? fmtAmt(l.closing_balance) : "-";
          rows += `
            <tr class="cb-ledger-row" data-ledger-id="${l.id}" title="Click to view this ledger's statement">
              <td>${l.name}</td>
              <td class="amt">${lDebit}</td>
              <td class="amt">${lCredit}</td>
            </tr>`;
        });
      });

      const gtDebit = data.grand_total >= 0 ? fmtAmt(data.grand_total) : "-";
      const gtCredit = data.grand_total < 0 ? fmtAmt(data.grand_total) : "-";
      rows += `
        <tr class="cb-grand-total-row">
          <td>Grand Total</td>
          <td class="amt">${gtDebit}</td>
          <td class="amt">${gtCredit}</td>
        </tr>`;

      tbody.innerHTML = rows;
      tbody.querySelectorAll(".cb-ledger-row").forEach((row) => {
        row.addEventListener("click", () => navigateToLedger(row));
      });
    }

    // Keyboard row navigation - Up/Down moves a highlighted "current row"
    // (same look as mouse hover), Enter drills into the ledger, same as a
    // click. Ignored while typing in any filter/search field so arrow keys
    // there still move the text cursor as normal.
    let selectedRowIndex = -1;
    function visibleDataRows() {
      return Array.from(document.querySelectorAll("#main-data-tbody tr.cb-ledger-row")).filter((r) => r.style.display !== "none");
    }
    function selectRow(index) {
      const rows = visibleDataRows();
      rows.forEach((r) => r.classList.remove("cb-row-selected"));
      if (!rows.length) { selectedRowIndex = -1; return; }
      selectedRowIndex = Math.max(0, Math.min(index, rows.length - 1));
      const row = rows[selectedRowIndex];
      row.classList.add("cb-row-selected");
      row.scrollIntoView({ block: "nearest" });
    }
    // Keeps the keyboard-selected row in sync with whatever the mouse is
    // actually over - without this, moving the mouse to hover a different
    // row while an old keyboard selection is still stuck elsewhere made it
    // look like hover had stopped working (two rows lit up at once).
    document.getElementById("main-data-tbody").addEventListener("mouseover", (e) => {
      const row = e.target.closest("tr.cb-ledger-row");
      if (!row) return;
      const idx = visibleDataRows().indexOf(row);
      if (idx !== -1) selectRow(idx);
    });
    document.addEventListener("keydown", (e) => {
      if (!["ArrowDown", "ArrowUp", "Enter"].includes(e.key)) return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (["INPUT", "SELECT", "TEXTAREA"].includes(tag)) return;
      const rows = visibleDataRows();
      if (!rows.length) return;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        selectRow(selectedRowIndex < rows.length - 1 ? selectedRowIndex + 1 : 0);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        selectRow(selectedRowIndex > 0 ? selectedRowIndex - 1 : rows.length - 1);
      } else if (e.key === "Enter" && selectedRowIndex >= 0) {
        e.preventDefault();
        navigateToLedger(rows[selectedRowIndex]);
      }
    });

    function exportCSV() {
      let csv = [];
      const rows = document.querySelectorAll("#main-data-table tr");
      rows.forEach((row) => {
        let cols = Array.from(row.querySelectorAll("th, td")).map((td) => `"${td.innerText.replace(/"/g, '""')}"`);
        csv.push(cols.join(","));
      });
      const blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "cash-bank-book.csv";
      link.click();
    }

    function filterTable(query) {
      const q = query.toLowerCase();
      const rows = document.querySelectorAll("#main-data-table tbody tr");
      rows.forEach((r) => {
        r.style.display = r.textContent.toLowerCase().includes(q) ? "" : "none";
      });
    }

    // Called from onclick="..." attributes above, which always run in the
    // real global scope regardless of this IIFE.
    window.exportCSV = exportCSV;
    window.loadCashBankBook = loadCashBankBook;
    window.filterTable = filterTable;
    })();
  </script>
</body>
</html>
