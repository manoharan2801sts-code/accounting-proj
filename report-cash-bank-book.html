<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Cash & Bank Book — TRAVEL AGENCY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="assets/css/design-system.css" rel="stylesheet" />
  <link href="assets/css/app.css" rel="stylesheet" />
<link href="assets/css/loader.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <style>
    .page-header-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .page-title-group h1 { font-size: 1.25rem; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
    .page-title-group .breadcrumb { font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 0.25rem; display: flex; gap: 0.4rem; align-items: center; }

    .filter-card {
      background: var(--color-white); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: 1rem 1.25rem; margin-bottom: 1.25rem;
      display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap;
    }
    .filter-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .filter-group label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--color-text-muted); letter-spacing: 0.03em; }

    .table-container {
      background: var(--color-white); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); overflow: hidden;
    }
    .cb-head {
      padding: 0.85rem 1.25rem; border-bottom: 1px solid var(--color-border);
      display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    }
    .cb-head .cb-title { font-size: 1rem; font-weight: 700; color: var(--color-text-dark); }
    .cb-head .cb-range { font-size: 12px; color: var(--color-text-muted); }

    .table-custom { width: 100%; border-collapse: collapse; text-align: left; }
    .table-custom th {
      padding: 0.65rem 0.85rem; background: #F8FAFC; border-bottom: 1px solid var(--color-border);
      font-size: 11.5px; font-weight: 700; text-transform: uppercase; color: var(--color-text-muted); letter-spacing: 0.03em;
    }
    .table-custom td {
      padding: 0.55rem 0.85rem; border-bottom: 1px solid var(--color-border-subtle);
      font-size: 12.5px; color: var(--color-text); vertical-align: middle;
    }
    .table-custom tbody tr:last-child td { border-bottom: none; }
    .table-custom tbody tr.cb-ledger-row { cursor: pointer; }
    .table-custom tbody tr.cb-ledger-row:hover { background: #F8FAFC; }
    .table-custom tbody tr.cb-ledger-row td:first-child { padding-left: 2rem; font-style: italic; color: var(--color-text-dark); }
    .table-custom tbody tr.cb-group-row td { background: var(--color-primary-tint-strong); font-weight: 700; color: var(--color-primary); }
    .table-custom tbody tr.cb-group-row td:first-child { font-weight: 700; }

    .cb-grand-total-row td { border-top: 2px solid var(--color-border); font-weight: 800; font-size: 13.5px; background: #FAFBFD; }

    .amt { font-family: var(--font-mono); font-weight: 600; text-align: right; }
    th.amt-header { text-align: right; }
  </style>
</head>
<body>
<script src="assets/js/loader.js?v=2"></script>
  <header class="app-topnav" id="shell-topnav"></header>
  <div class="app-body">
    <main class="app-main" style="max-width: 1440px; margin: 0 auto; padding: 1.5rem 2rem;">
      <div class="page-header-row">
        <div class="page-title-group">
          <div class="breadcrumb">Reports &rsaquo; Accounts Book &rsaquo; Cash &amp; Bank Book</div>
          <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Cash &amp; Bank Book</h1>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button type="button" class="dom-nav-btn" onclick="window.print()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2m-12 0v4h12v-4"/></svg>
            Print
          </button>
          <button type="button" class="dom-nav-btn btn-primary" onclick="exportCSV()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4m14-7l-5 5-5-5m5 5V3"/></svg>
            Export CSV
          </button>
        </div>
      </div>

      <div class="filter-card">
        <div class="filter-group">
          <label>From Date</label>
          <input type="date" class="form-control-custom" id="filter-from" style="height:34px; padding:0.25rem 0.6rem;" />
        </div>
        <div class="filter-group">
          <label>To Date</label>
          <input type="date" class="form-control-custom" id="filter-to" style="height:34px; padding:0.25rem 0.6rem;" />
        </div>
        <button type="button" class="dom-nav-btn btn-primary" style="height:34px;" onclick="loadCashBankBook()">Apply</button>
      </div>

      <div class="table-container">
        <div class="cb-head">
          <div class="cb-title">Cash &amp; Bank Summary</div>
          <div class="cb-range" id="cb-date-range"></div>
        </div>
        <div style="overflow-x:auto;">
          <table class="table-custom" id="main-data-table">
            <thead>
              <tr>
                <th>Particulars</th>
                <th class="amt-header">Debit</th>
                <th class="amt-header">Credit</th>
              </tr>
            </thead>
            <tbody id="main-data-tbody">
              <tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/hardcode.js"></script>
  <script src="assets/js/shell.js"></script>
  <script>
    // Not gated on DOMContentLoaded - this page's <script> can be injected
    // by the app's SPA navigation (shell.js's navigateTo) into a document
    // that already finished loading, so DOMContentLoaded never fires again
    // and this would silently never run except on a hard refresh.
    //
    // Wrapped in an IIFE (unlike a naive top-level script) because
    // shell.js re-executes this exact block every time this page is
    // navigated to - a second execution's top-level `let`/`const` in the
    // SAME document throws "Identifier has already been declared" (a
    // classic-script global lexical environment persists across separately
    // executed <script> tags), which silently aborts the whole block and
    // leaves the page stuck on its static "Loading..." forever until a
    // hard refresh starts the document fresh. Functions the page's own
    // onclick="..." attributes call are exposed on window explicitly,
    // since they're no longer implicitly global once wrapped.
    (function () {
    let activeCompanyId;

    (async function init() {
      try {
        const active = await VoyagerShell.init({ activeKey: "rep-cash-bank-book" });
        if (active) activeCompanyId = Number(active.id);
      } catch (err) {
        console.error("Shell init failed", err);
      }
      await loadCashBankBook();
    })();

    function fmtAmt(n) {
      const v = Number(n) || 0;
      return Math.abs(v).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function fmtDateDisplay(iso) {
      if (!iso) return "";
      const d = new Date(iso + "T00:00:00");
      if (isNaN(d)) return iso;
      return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "2-digit" }).replace(/ /g, "-");
    }

    async function loadCashBankBook() {
      const tbody = document.getElementById("main-data-tbody");
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">Loading...</td></tr>`;

      const fromDate = document.getElementById("filter-from").value;
      const toDate = document.getElementById("filter-to").value;
      let params = `company_id=${activeCompanyId}`;
      if (fromDate) params += `&from_date=${fromDate}`;
      if (toDate) params += `&to_date=${toDate}`;

      try {
        const res = await fetch(`${window.API_BASE || "/api"}/cash-bank-book/?${params}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Server returned ${res.status}`);

        const rangeFrom = data.from_date ? fmtDateDisplay(data.from_date) : "Beginning";
        const rangeTo = data.to_date ? fmtDateDisplay(data.to_date) : "Date";
        document.getElementById("cb-date-range").textContent = data.from_date && data.from_date === data.to_date
          ? rangeFrom : `${rangeFrom} to ${rangeTo}`;

        renderTable(data);
      } catch (err) {
        console.error("Could not load the cash & bank book - is the Django backend running?", err);
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">Could not load data. Is the Django backend running on localhost:8000?</td></tr>`;
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById("main-data-tbody");
      if (!data.groups.length) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">No Cash-in-Hand or Bank Accounts ledgers found.</td></tr>`;
        return;
      }

      let rows = "";
      data.groups.forEach((g) => {
        const gDebit = g.closing_balance >= 0 ? fmtAmt(g.closing_balance) : "-";
        const gCredit = g.closing_balance < 0 ? fmtAmt(g.closing_balance) : "-";
        rows += `
          <tr class="cb-group-row">
            <td>${g.group_name}</td>
            <td class="amt">${gDebit}</td>
            <td class="amt">${gCredit}</td>
          </tr>`;
        g.ledgers.forEach((l) => {
          const lDebit = l.closing_balance >= 0 ? fmtAmt(l.closing_balance) : "-";
          const lCredit = l.closing_balance < 0 ? fmtAmt(l.closing_balance) : "-";
          rows += `
            <tr class="cb-ledger-row" data-ledger-id="${l.id}" title="Click to view this ledger's statement">
              <td>${l.name}</td>
              <td class="amt">${lDebit}</td>
              <td class="amt">${lCredit}</td>
            </tr>`;
        });
      });

      const gtDebit = data.grand_total >= 0 ? fmtAmt(data.grand_total) : "-";
      const gtCredit = data.grand_total < 0 ? fmtAmt(data.grand_total) : "-";
      rows += `
        <tr class="cb-grand-total-row">
          <td>Grand Total</td>
          <td class="amt">${gtDebit}</td>
          <td class="amt">${gtCredit}</td>
        </tr>`;

      tbody.innerHTML = rows;
      tbody.querySelectorAll(".cb-ledger-row").forEach((row) => {
        row.addEventListener("click", () => {
          window.location.href = `report-ledger-book.html?ledger_id=${row.dataset.ledgerId}`;
        });
      });
    }

    function exportCSV() {
      let csv = [];
      const rows = document.querySelectorAll("#main-data-table tr");
      rows.forEach((row) => {
        let cols = Array.from(row.querySelectorAll("th, td")).map((td) => `"${td.innerText.replace(/"/g, '""')}"`);
        csv.push(cols.join(","));
      });
      const blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "cash-bank-book.csv";
      link.click();
    }

    // Called from onclick="..." attributes above, which always run in the
    // real global scope regardless of this IIFE.
    window.exportCSV = exportCSV;
    window.loadCashBankBook = loadCashBankBook;
    })();
  </script>
</body>
</html>
