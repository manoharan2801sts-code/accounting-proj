<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Day Book — TRAVEL AGENCY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="assets/css/design-system.css" rel="stylesheet" />
  <link href="assets/css/app.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <style>
    /* Locked to the viewport - only the table body scrolls, not the whole
       page (same pattern as report-trial-balance.html/report-dsr-
       airline-booking.html). */
    html, body { height: 100%; overflow: hidden; margin: 0; }
    .db-main {
      display: flex; flex-direction: column;
      height: calc(100vh - var(--topnav-height) - var(--menubar-height, 0px));
      box-sizing: border-box;
    }
    .db-main .page-header-row { flex-shrink: 0; }
    .db-main .table-container { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .table-scroll { flex: 1; min-height: 0; overflow: auto; }
    .table-custom thead th { position: sticky; top: 0; z-index: 1; }

    .page-header-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }

    /* Compact single-row toolbar (From/To/Apply/Filter on the left,
       Print/Export CSV pushed to the far right via the margin-left:auto
       spacer) - same pattern as report-trial-balance.html. */
    .rpt-toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; width: 100%; }
    .rpt-toolbar-label { font-size: 11px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em; }
    .rpt-toolbar-date { height: 26px; width: 116px; padding: 0 6px; font-size: 12px; box-sizing: border-box; }

    .table-container {
      background: var(--color-white); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); overflow: hidden;
    }

    /* Day-book print head — ledger name replaced with "Day Book" on the
       left, company name + applied date range on the right, same
       banner pattern as the Ledger report. */
    .lb-head {
      padding: 0.5rem 1rem; border-bottom: 1px solid var(--color-border);
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
      flex-shrink: 0;
    }
    .lb-head .lb-ledger-name { font-size: 0.78rem; font-weight: 700; color: var(--color-text-dark); }

    .table-custom { width: 100%; border-collapse: collapse; text-align: left; }
    .table-custom th { padding: 0.35rem 0.8rem; background: #F8FAFC; border-bottom: 1px solid var(--color-border);
      font-size: 10px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em;
      white-space: nowrap; }
    .table-custom td {
      padding: 0.6rem 0.85rem; border-bottom: 1px solid var(--color-border-subtle);
      font-size: 12.5px; color: var(--color-text); vertical-align: middle; white-space: nowrap;
    }
    .table-custom tbody tr:last-child td { border-bottom: none; }
    .table-custom tbody tr.txn-row { cursor: pointer; }
    .table-custom tbody tr.txn-row.db-row-selected td { background: var(--color-primary); color: #FFFFFF; }
    .table-custom tbody tr.txn-row.db-row-selected td.particulars { color: #FFFFFF; }
    .table-custom td.rownum { color: var(--color-text-muted); font-weight: 600; }
    .table-custom td.particulars { font-weight: 700; color: var(--color-text-dark); white-space: normal; }

    /* Total is a separate, non-scrolling table pinned below .table-scroll
       (not a sticky row inside it) so it sits flush at the bottom of the
       grid even when there are too few rows to fill the scroll area, and
       still never scrolls away when there are many. Column widths are
       synced to the main table's header via JS (syncTotalColumnWidths). */
    .lb-total-wrap { flex-shrink: 0; overflow: hidden; }
    #lb-total-table { table-layout: fixed; }
    .lb-total-row td { border-top: 2px solid var(--color-border); font-weight: 700; background: #FAFBFD; }

    .amt { font-family: var(--font-mono); font-weight: 600; text-align: right; }
    th.amt-header { text-align: right; }

    .filter-btn-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .filter-active-chip {
      display: none; align-items: center; gap: 0.35rem; background: #EFF6FF; color: var(--color-primary);
      border: 1px solid #BFDBFE; border-radius: 999px; padding: 0.3rem 0.7rem; font-size: 12px; font-weight: 600;
    }
    .filter-active-chip.show { display: inline-flex; }
    .filter-active-chip button {
      border: none; background: none; cursor: pointer; color: var(--color-primary); font-weight: 800; line-height: 1; padding: 0;
    }

    /* Filter popup — a plain search box + Apply by default; an "Advance
       Filter" button at the top switches to a column dropdown + value
       text box for a targeted, single-column filter. */
    .ef-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
      align-items: center; justify-content: center; z-index: 1100;
    }
    .ef-backdrop.open { display: flex; }
    .ef-window {
      width: 520px; max-width: 92vw; background: var(--color-white);
      border-radius: var(--radius-md); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden;
    }
    .ef-head {
      padding: 0.8rem 1rem; border-bottom: 1px solid var(--color-border);
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    }
    .ef-head h2 { margin: 0; font-size: 0.95rem; font-weight: 700; }
    .ef-close { cursor: pointer; background: none; border: none; font-size: 1.1rem; color: var(--color-text-muted); line-height: 1; }
    .ef-advance-row { padding: 0.65rem 1rem 0; display: flex; justify-content: flex-end; }
    .ef-advance-btn {
      font-size: 11.5px; font-weight: 700; color: var(--color-primary); background: none; border: none; cursor: pointer;
      display: flex; align-items: center; gap: 0.3rem; padding: 0;
    }
    .ef-body { padding: 0.75rem 1rem 1rem; }

    .ef-cond-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.5rem; }
    .ef-cond-join {
      flex: 0 0 62px; height: 34px; font-size: 11.5px; font-weight: 700; text-align: center;
      border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: #F8FAFC; color: var(--color-primary);
    }
    .ef-cond-join-spacer { flex: 0 0 62px; }
    .ef-cond-column { flex: 0 0 150px; height: 34px; }
    .ef-cond-value { flex: 1; min-width: 0; height: 34px; }
    .ef-cond-remove {
      flex: 0 0 26px; height: 26px; border: none; background: none; cursor: pointer;
      color: var(--color-text-muted); font-size: 1.05rem; line-height: 1; padding: 0;
    }
    .ef-cond-remove:hover { color: var(--color-danger); }
    .ef-add-cond-btn {
      font-size: 11px; font-weight: 700; color: var(--color-primary); background: none;
      border: 1px dashed #BFDBFE; border-radius: var(--radius-sm); cursor: pointer; padding: 0.25rem 0.5rem; width: auto; display: block; margin: 0 auto;
    }
    .ef-add-cond-btn:hover { background: #EFF6FF; }

    .ef-footer { padding: 0.7rem 1rem; border-top: 1px solid var(--color-border); display: flex; justify-content: flex-end; gap: 0.5rem; }
  </style>
</head>
<body>
  <header class="app-topnav" id="shell-topnav"></header>
  <div class="app-body">
    <main class="app-main db-main" style="max-width: 1440px; margin: 0 auto; padding: 1.5rem 2rem; width: 100%;">
      <div class="page-header-row">
        <div class="rpt-toolbar">
          <span class="rpt-toolbar-label">From</span>
          <input type="date" class="form-control-custom rpt-toolbar-date" id="filter-from" />
          <span class="rpt-toolbar-label">To</span>
          <input type="date" class="form-control-custom rpt-toolbar-date" id="filter-to" />
          <button type="button" class="dom-nav-btn btn-primary" onclick="loadDayBook()">Apply</button>
          <div class="filter-btn-wrap">
            <button type="button" class="dom-nav-btn" id="open-filter-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
              Filter
            </button>
            <span class="filter-active-chip" id="filter-active-chip">
              <span id="filter-active-chip-label"></span>
              <button type="button" id="filter-clear-btn" title="Clear filter">&times;</button>
            </span>
          </div>
          <span style="margin-left:auto;"></span>
          <button type="button" class="dom-nav-btn" onclick="window.print()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2m-12 0v4h12v-4"/></svg>
            Print
          </button>
          <button type="button" class="dom-nav-btn btn-primary" onclick="exportCSV()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4m14-7l-5 5-5-5m5 5V3"/></svg>
            Export CSV
          </button>
        </div>
      </div>

      <div class="table-container">
        <div class="lb-head">
          <div class="lb-ledger-name">Day Book</div>
        </div>
        <div class="table-scroll">
          <table class="table-custom" id="main-data-table">
            <thead>
              <tr>
                <th># No</th>
                <th>Date</th>
                <th>Particulars</th>
                <th>Vch Type</th>
                <th>S PNR</th>
                <th>Air-PNR</th>
                <th>Ticket No</th>
                <th class="amt-header">Debit</th>
                <th class="amt-header">Credit</th>
              </tr>
            </thead>
            <tbody id="main-data-tbody">
              <tr><td colspan="9" style="text-align:center; padding:2rem; color:var(--color-text-muted);">Loading...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="lb-total-wrap">
          <table class="table-custom" id="lb-total-table">
            <tbody>
              <tr class="lb-total-row" id="lb-total-row"></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Filter popup: plain search box by default, "Advance Filter" swaps
       it for a column dropdown + value text box (single-column filter). -->
  <div class="ef-backdrop" id="ef-backdrop">
    <div class="ef-window">
      <div class="ef-head">
        <h2>Filter</h2>
        <button type="button" class="ef-close" id="ef-close-btn">&times;</button>
      </div>
      <div class="ef-advance-row">
        <button type="button" class="ef-advance-btn" id="ef-advance-toggle-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
          Advance Filter
        </button>
      </div>
      <div class="ef-body">
        <!-- Simple mode: one search box, matched against every column. -->
        <input type="text" class="form-control-custom" id="ef-simple-input" placeholder="Search..." autocomplete="off" style="height:34px; width:100%;" />
        <!-- Advanced mode: Tally-style multi-condition list — each row is
             a Column + Value pair, joined to the previous row by AND/OR. -->
        <div id="ef-adv-row" style="display:none;">
          <div id="ef-cond-list"></div>
          <button type="button" class="ef-add-cond-btn" id="ef-add-cond-btn">+ Add Condition</button>
        </div>
      </div>
      <div class="ef-footer">
        <button type="button" class="dom-nav-btn" id="ef-cancel-btn">Cancel</button>
        <button type="button" class="dom-nav-btn btn-primary" id="ef-apply-btn">Apply</button>
      </div>
    </div>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api.js?v=3"></script>
  <script src="assets/js/hardcode.js"></script>
  <script src="assets/js/util.js?v=2"></script>
  <script src="assets/js/shell.js?v=21"></script>
  <script>
    // Not gated on DOMContentLoaded - this page's <script> can be injected
    // by the app's SPA navigation (shell.js's navigateTo) into a document
    // that already finished loading, so DOMContentLoaded never fires again
    // and this would silently never run except on a hard refresh.
    //
    // Wrapped in an IIFE (unlike a naive top-level script) because
    // shell.js re-executes this exact block every time this page is
    // navigated to - a second execution's top-level `let`/`const` in the
    // SAME document throws "Identifier has already been declared" (a
    // classic-script global lexical environment persists across separately
    // executed <script> tags), which silently aborts the whole block and
    // leaves the page stuck on its static "Loading..." forever until a
    // hard refresh starts the document fresh. Functions the page's own
    // onclick="..." attributes call are exposed on window explicitly,
    // since they're no longer implicitly global once wrapped.
    (function () {
    let activeCompanyId;
    let lastLoadedData = null;
    let rawTxns = [];
    let activeFilter = null; // { label, test(txn) => bool }

    (async function init() {
      try {
        const active = await VoyagerShell.init({ activeKey: "rep-day-book" });
        if (active) activeCompanyId = Number(active.id);
        await VoyagerUtil.loadDecimalPlaces(activeCompanyId);
      } catch (err) {
        console.error("Shell init failed", err);
      }
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById("filter-from").value = today;
      document.getElementById("filter-to").value = today;
      await loadDayBook();
    })();

    function fmtAmt(n) {
      const v = Number(n) || 0;
      const d = VoyagerUtil.getDecimalPlaces();
      return "₹" + Math.abs(v).toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    function fmtDateDisplay(iso) {
      if (!iso) return "-";
      const d = new Date(iso + "T00:00:00");
      if (isNaN(d)) return iso;
      return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
    }

    async function loadDayBook() {
      const tbody = document.getElementById("main-data-tbody");
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:2rem; color:var(--color-text-muted);">Loading...</td></tr>`;

      const fromDate = document.getElementById("filter-from").value;
      const toDate = document.getElementById("filter-to").value;
      let params = `company_id=${activeCompanyId}`;
      if (fromDate) params += `&from_date=${fromDate}`;
      if (toDate) params += `&to_date=${toDate}`;

      try {
        const res = await fetch(`http://localhost:8000/api/day-book/?${params}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Server returned ${res.status}`);


        lastLoadedData = data;
        rawTxns = data.transactions;
        activeFilter = null;
        updateFilterChip();
        applyFilterAndRender();
      } catch (err) {
        console.error("Could not load the day book - is the Django backend running?", err);
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:2rem; color:var(--color-text-muted);">Could not load data. Is the Django backend running on localhost:8000?</td></tr>`;
      }
    }

    // ============================================================
    // Filter popup — simple mode is one search box matched against
    // every column; "Advance Filter" swaps it for a column dropdown +
    // a value text box, filtering only that one column.
    // ============================================================
    const FILTER_COLUMNS = [
      { key: "date", label: "Date", get: (t) => fmtDateDisplay(t.date) },
      { key: "particulars", label: "Particulars", get: (t) => t.particulars || "-" },
      { key: "voucher_type", label: "Vch Type", get: (t) => t.voucher_type || "-" },
      { key: "s_pnr", label: "S PNR", get: (t) => t.s_pnr || "-" },
      { key: "air_pnr", label: "Air-PNR", get: (t) => t.air_pnr || "-" },
      { key: "ticket_no", label: "Ticket No", get: (t) => t.ticket_no || "-" },
      { key: "debit", label: "Debit", get: (t) => (t.debit ? fmtAmt(t.debit) : "-") },
      { key: "credit", label: "Credit", get: (t) => (t.credit ? fmtAmt(t.credit) : "-") },
    ];
    let isAdvanceMode = false;

    function applyFilterAndRender() {
      const txns = activeFilter
        ? rawTxns.filter((t) => activeFilter.test(t))
        : rawTxns;
      renderTable(txns);
    }

    function updateFilterChip() {
      const chip = document.getElementById("filter-active-chip");
      if (activeFilter) {
        document.getElementById("filter-active-chip-label").textContent = activeFilter.label;
        chip.classList.add("show");
      } else {
        chip.classList.remove("show");
      }
    }

    function openFilterPopup() {
      document.getElementById("ef-backdrop").classList.add("open");
      isAdvanceMode = false;
      document.getElementById("ef-simple-input").style.display = "";
      document.getElementById("ef-adv-row").style.display = "none";
      document.getElementById("ef-advance-toggle-btn").innerHTML = `
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
        Advance Filter`;
      document.getElementById("ef-simple-input").value = "";
      document.getElementById("ef-cond-list").innerHTML = "";
      addConditionRow();
      setTimeout(() => document.getElementById("ef-simple-input").focus(), 50);
    }
    function closeFilterPopup() {
      document.getElementById("ef-backdrop").classList.remove("open");
    }
    document.getElementById("ef-advance-toggle-btn").addEventListener("click", () => {
      isAdvanceMode = !isAdvanceMode;
      document.getElementById("ef-simple-input").style.display = isAdvanceMode ? "none" : "";
      document.getElementById("ef-adv-row").style.display = isAdvanceMode ? "" : "none";
      document.getElementById("ef-advance-toggle-btn").innerHTML = isAdvanceMode
        ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m7 7l-7-7 7-7"/></svg> Simple Filter`
        : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg> Advance Filter`;
    });

    // Tally-style multi-condition rows: each new row after the first
    // gets an AND/OR join select in front of its Column + Value pair.
    function addConditionRow() {
      const list = document.getElementById("ef-cond-list");
      const isFirst = list.children.length === 0;
      const usedKeys = Array.from(list.querySelectorAll(".ef-cond-column")).map((sel) => sel.value);
      const defaultCol = FILTER_COLUMNS.find((c) => !usedKeys.includes(c.key)) || FILTER_COLUMNS[0];
      const row = document.createElement("div");
      row.className = "ef-cond-row";
      row.innerHTML = `
        ${isFirst ? `<span class="ef-cond-join-spacer"></span>` : `
          <select class="ef-cond-join">
            <option value="AND">AND</option>
            <option value="OR">OR</option>
          </select>`}
        <select class="form-control-custom ef-cond-column"></select>
        <input type="text" class="form-control-custom ef-cond-value" placeholder="Enter value..." autocomplete="off" />
        <button type="button" class="ef-cond-remove" title="Remove condition">&times;</button>
      `;
      row.querySelector(".ef-cond-remove").addEventListener("click", () => {
        if (list.children.length <= 1) return;
        row.remove();
        // The first remaining row never shows a join select.
        const first = list.children[0];
        if (first && first.querySelector(".ef-cond-join")) {
          first.querySelector(".ef-cond-join").outerHTML = `<span class="ef-cond-join-spacer"></span>`;
        }
        refreshConditionColumnOptions();
      });
      list.appendChild(row);
      row.querySelector(".ef-cond-column").dataset.value = defaultCol.key;
      refreshConditionColumnOptions();
    }
    document.getElementById("ef-add-cond-btn").addEventListener("click", addConditionRow);

    // Excel/Tally behaviour: a column already picked in another condition
    // row is removed from every other row's dropdown, so the same field
    // can't be selected twice.
    function refreshConditionColumnOptions() {
      const selects = Array.from(document.querySelectorAll("#ef-cond-list .ef-cond-column"));
      const chosen = selects.map((sel) => sel.dataset.value || sel.value);
      selects.forEach((sel, idx) => {
        const mine = sel.dataset.value || sel.value;
        const takenByOthers = chosen.filter((_, i) => i !== idx);
        const available = FILTER_COLUMNS.filter((c) => c.key === mine || !takenByOthers.includes(c.key));
        sel.innerHTML = available.map((c) => `<option value="${c.key}" ${c.key === mine ? "selected" : ""}>${c.label}</option>`).join("");
        sel.dataset.value = mine;
      });
      selects.forEach((sel) => {
        sel.onchange = () => {
          sel.dataset.value = sel.value;
          refreshConditionColumnOptions();
        };
      });
    }

    document.getElementById("open-filter-btn").addEventListener("click", openFilterPopup);
    document.getElementById("ef-close-btn").addEventListener("click", closeFilterPopup);
    document.getElementById("ef-cancel-btn").addEventListener("click", closeFilterPopup);
    document.getElementById("ef-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "ef-backdrop") closeFilterPopup();
    });

    document.getElementById("ef-apply-btn").addEventListener("click", () => {
      if (isAdvanceMode) {
        const rows = Array.from(document.querySelectorAll("#ef-cond-list .ef-cond-row"));
        const conditions = rows.map((row) => {
          const columnKey = row.querySelector(".ef-cond-column").value;
          const value = row.querySelector(".ef-cond-value").value.trim();
          const joinEl = row.querySelector(".ef-cond-join");
          return { col: FILTER_COLUMNS.find((c) => c.key === columnKey), value, join: joinEl ? joinEl.value : null };
        }).filter((c) => c.value);

        if (!conditions.length) {
          activeFilter = null;
        } else {
          const label = conditions.map((c, i) => `${i > 0 ? ` ${c.join} ` : ""}${c.col.label}: "${c.value}"`).join("");
          activeFilter = {
            label,
            test: (t) => {
              let result = conditions[0].col.get(t).toLowerCase().includes(conditions[0].value.toLowerCase());
              for (let i = 1; i < conditions.length; i++) {
                const c = conditions[i];
                const match = c.col.get(t).toLowerCase().includes(c.value.toLowerCase());
                result = c.join === "OR" ? (result || match) : (result && match);
              }
              return result;
            },
          };
        }
      } else {
        const value = document.getElementById("ef-simple-input").value.trim();
        if (!value) {
          activeFilter = null;
        } else {
          const q = value.toLowerCase();
          activeFilter = {
            label: `"${value}"`,
            test: (t) => FILTER_COLUMNS.some((c) => c.get(t).toLowerCase().includes(q)),
          };
        }
      }
      closeFilterPopup();
      updateFilterChip();
      applyFilterAndRender();
    });
    document.getElementById("filter-clear-btn").addEventListener("click", () => {
      activeFilter = null;
      updateFilterChip();
      applyFilterAndRender();
    });

    function navigateToTicket(row) {
      if (row.dataset.cancellationTicketId) {
        window.location.href = `ticket-entry.html?cancellation_saved_id=${row.dataset.cancellationTicketId}`;
        return;
      }
      window.location.href = row.dataset.rescheduleTicketId
        ? `ticket-entry.html?reschedule_saved_id=${row.dataset.rescheduleTicketId}`
        : `ticket-entry.html?id=${row.dataset.ticketId}`;
    }

    function renderTable(txns) {
      const tbody = document.getElementById("main-data-tbody");
      const totalRow = document.getElementById("lb-total-row");
      selectedRowIndex = -1; // stale after a full re-render - rows are new DOM nodes
      if (!txns.length) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:2rem; color:var(--color-text-muted);">No transactions match the current filter.</td></tr>`;
        totalRow.innerHTML = "";
        return;
      }

      const totalDebit = txns.reduce((sum, t) => sum + (Number(t.debit) || 0), 0);
      const totalCredit = txns.reduce((sum, t) => sum + (Number(t.credit) || 0), 0);

      const rows = txns.map((t, idx) => `
        <tr class="${(t.ticket_id || t.reschedule_ticket_id || t.cancellation_ticket_id) ? "txn-row" : ""}" data-ticket-id="${t.ticket_id || ""}" data-reschedule-ticket-id="${t.reschedule_ticket_id || ""}" data-cancellation-ticket-id="${t.cancellation_ticket_id || ""}" title="${(t.ticket_id || t.reschedule_ticket_id || t.cancellation_ticket_id) ? "Click to open this ticket" : ""}">
          <td class="rownum">${idx + 1}</td>
          <td>${fmtDateDisplay(t.date)}</td>
          <td class="particulars">${t.particulars || "-"}</td>
          <td>${t.voucher_type || "-"}</td>
          <td>${t.s_pnr || "-"}</td>
          <td>${t.air_pnr || "-"}</td>
          <td>${t.ticket_no || "-"}</td>
          <td class="amt">${t.debit ? fmtAmt(t.debit) : "-"}</td>
          <td class="amt">${t.credit ? fmtAmt(t.credit) : "-"}</td>
        </tr>
      `).join("");

      tbody.innerHTML = rows;
      tbody.querySelectorAll("tr.txn-row").forEach((row) => {
        row.addEventListener("click", () => navigateToTicket(row));
      });

      totalRow.innerHTML = `
        <td colspan="7" style="text-align:right;">Total :</td>
        <td class="amt">${fmtAmt(totalDebit)}</td>
        <td class="amt">${fmtAmt(totalCredit)}</td>`;
      syncTotalColumnWidths();
    }

    // Keeps the separate (non-scrolling) total table's columns aligned with
    // the main table's header, since both tables size their columns
    // independently (table-layout differs per table's own content).
    function syncTotalColumnWidths() {
      const headerCells = document.querySelectorAll("#main-data-table thead th");
      const totalCells = document.querySelectorAll("#lb-total-row td");
      if (!headerCells.length || !totalCells.length) return;
      const widths = Array.from(headerCells).map((th) => th.getBoundingClientRect().width);
      let i = 0;
      totalCells.forEach((td) => {
        const span = td.colSpan || 1;
        const w = widths.slice(i, i + span).reduce((a, b) => a + b, 0);
        td.style.width = w + "px";
        i += span;
      });
    }
    window.addEventListener("resize", () => syncTotalColumnWidths());

    // Keyboard row navigation - Up/Down moves a highlighted "current row"
    // (same look as mouse hover), Enter opens the ticket, same as a click.
    // Only txn-row transactions are keyboard-navigable, matching the
    // existing hover/click behaviour above (rows with no linked ticket
    // are informational and were never clickable either). Ignored while
    // typing in any filter/search field so arrow keys there still move
    // the text cursor as normal.
    let selectedRowIndex = -1;
    function visibleDataRows() {
      return Array.from(document.querySelectorAll("#main-data-tbody tr.txn-row")).filter((r) => r.style.display !== "none");
    }
    function selectRow(index) {
      const rows = visibleDataRows();
      rows.forEach((r) => r.classList.remove("db-row-selected"));
      if (!rows.length) { selectedRowIndex = -1; return; }
      selectedRowIndex = Math.max(0, Math.min(index, rows.length - 1));
      const row = rows[selectedRowIndex];
      row.classList.add("db-row-selected");
      row.scrollIntoView({ block: "nearest" });
    }
    // Keeps the keyboard-selected row in sync with whatever the mouse is
    // actually over - without this, moving the mouse to hover a different
    // row while an old keyboard selection is still stuck elsewhere made it
    // look like hover had stopped working (two rows lit up at once).
    document.getElementById("main-data-tbody").addEventListener("mouseover", (e) => {
      const row = e.target.closest("tr.txn-row");
      if (!row) return;
      const idx = visibleDataRows().indexOf(row);
      if (idx !== -1) selectRow(idx);
    });
    document.addEventListener("keydown", (e) => {
      if (!["ArrowDown", "ArrowUp", "Enter"].includes(e.key)) return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (["INPUT", "SELECT", "TEXTAREA"].includes(tag)) return;
      const rows = visibleDataRows();
      if (!rows.length) return;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        selectRow(selectedRowIndex < rows.length - 1 ? selectedRowIndex + 1 : 0);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        selectRow(selectedRowIndex > 0 ? selectedRowIndex - 1 : rows.length - 1);
      } else if (e.key === "Enter" && selectedRowIndex >= 0) {
        e.preventDefault();
        navigateToTicket(rows[selectedRowIndex]);
      }
    });

    function exportCSV() {
      let csv = [];
      const rows = document.querySelectorAll("#main-data-table tr, #lb-total-table tr");
      rows.forEach((row) => {
        let cols = Array.from(row.querySelectorAll("th, td")).map((td) => `"${td.innerText.replace(/"/g, '""')}"`);
        csv.push(cols.join(","));
      });
      const blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "day-book.csv";
      link.click();
    }

    // Called from onclick="..." attributes above, which always run in the
    // real global scope regardless of this IIFE.
    window.exportCSV = exportCSV;
    window.loadDayBook = loadDayBook;
    })();
  </script>
</body>
