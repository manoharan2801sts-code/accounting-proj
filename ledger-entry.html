<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>New Ledger — TRAVEL AGENCY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="assets/css/design-system.css" rel="stylesheet" />
<link href="assets/css/app.css?v=7" rel="stylesheet" />
<style>
  /* Same card design as the Voucher page: one white card, a light header
     strip per section, compact fields, compact report-size buttons in a
     footer strip. Locked to the viewport - only the card's form area
     scrolls (e.g. a Debtor's long address section), never the page. */
  html, body { height: 100%; overflow: hidden; margin: 0; }
  .lx-main {
    display: flex; flex-direction: column;
    height: calc(100vh - var(--topnav-height) - var(--menubar-height, 0px));
    box-sizing: border-box;
  }
  .lx-main > h1 { display: flex; align-items: center; gap: 0.4rem; font-size: 0.95rem; margin: 0 0 0.5rem; flex-shrink: 0; }
  .lx-card {
    background: var(--color-white); border: 1px solid var(--color-border); box-shadow: var(--shadow-xs);
    flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 0 !important;
  }
  .lx-body { flex: 1; min-height: 0; overflow-y: auto; }

  /* Section title -> header strip across the card */
  .lx-body .entry-section-title {
    display: flex; align-items: center; gap: 0.5rem; margin: 0; padding: 0.55rem 1rem;
    font-size: 13px; font-weight: 700; color: var(--color-text-dark); letter-spacing: 0; text-transform: none;
    background: var(--color-bg-subtle); border-top: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border);
  }
  .lx-body > .entry-section-title:first-child { border-top: none; }
  .lx-body .entry-grid {
    padding: 0.8rem 1rem 0.95rem; gap: 10px 14px;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  }
  .lx-body .field-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: var(--color-text-muted); margin-bottom: 0.3rem; }
  .lx-body .form-control-custom { height: 30px; padding: 0.25rem 0.55rem; font-size: 12.5px; border-radius: 2px; }
  .lx-body .field-hint { font-size: 11px; }
  /* Yes / No radio buttons, same height as the other fields */
  .lx-radio-group { display: flex; align-items: center; gap: 1.1rem; height: 30px; }
  .lx-radio { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 12.5px; font-weight: 600; color: var(--color-text-dark); cursor: pointer; margin: 0; }
  .lx-radio input { width: 15px; height: 15px; margin: 0; accent-color: var(--color-primary); cursor: pointer; }

  /* Footer strip with the compact buttons */
  .lx-card .entry-actions {
    flex-shrink: 0; margin: 0; padding: 0.4rem 1rem; gap: 0.5rem;
    background: var(--color-bg-subtle); border-top: 1px solid var(--color-border);
  }
  .lx-card .entry-actions .dom-nav-btn { text-decoration: none; display: inline-flex; align-items: center; }
</style>
</head><body>
<header class="app-topnav" id="shell-topnav"></header>
<div class="app-body">
  <aside class="app-sidebar" id="shell-sidebar"></aside>
  <main class="app-main lx-main" style="max-width:1400px; width:100%; margin-left:auto !important; margin-right:auto; padding:12px 40px;">
    <h1>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span id="page-title">New Ledger</span>
    </h1>
    <form id="ledger-form" class="lx-card">
      <div class="lx-body">

      <div class="entry-section-title">Ledger Detail</div>
      <div class="entry-grid">
        <div><label class="field-label">Ledger Name</label><input class="form-control-custom" id="name" required /><div class="field-hint" id="name_hint"></div></div>
        <div><label class="field-label">Group</label><select class="form-control-custom" id="parent_id" required></select></div>
        <div><label class="field-label">Opening Balance</label><input class="form-control-custom dom-amount" type="text" inputmode="decimal" id="opening_balance" value="0.00" /></div>
        <div><label class="field-label">Opening Balance Type</label>
          <select class="form-control-custom" id="opening_balance_type" data-options="openingBalanceTypes"></select>
        </div>
        <div id="agent-id-wrap" style="display:none;"><label class="field-label">Agent ID</label><input class="form-control-custom" id="agent_id" placeholder="e.g. AGT-001" /><div class="field-hint" id="agent_id_hint"></div></div>
      </div>

      <!-- BANK -->
      <div id="section-bank" style="display:none;">
        <div class="entry-section-title">Bank Details</div>
        <div class="entry-grid">
          <div><label class="field-label">Bank A/c No.</label><input class="form-control-custom" id="bank_account_no" /></div>
          <div><label class="field-label">Branch</label><input class="form-control-custom" id="bank_branch" /></div>
          <div><label class="field-label">IFSC Code</label><input class="form-control-custom" id="ifsc_code" placeholder="e.g. HDFC0001234" /></div>
          <div><label class="field-label">SWIFT Code</label><input class="form-control-custom" id="swift_code" placeholder="e.g. HDFCINBB" /></div>
          <!-- Only one Default Bank per company - choosing Yes here clears it on any other bank. -->
          <div><label class="field-label">Default Bank</label>
            <div class="lx-radio-group" role="radiogroup" aria-label="Default Bank">
              <label class="lx-radio"><input type="radio" name="is_default_bank" id="is_default_bank_yes" value="yes" /> Yes</label>
              <label class="lx-radio"><input type="radio" name="is_default_bank" id="is_default_bank_no" value="no" checked /> No</label>
            </div>
          </div>
        </div>
      </div>

      <!-- DEBTOR — India -->
      <div id="section-debtor-in" style="display:none;">
        <div class="entry-section-title">Debtor Detail — India</div>
        <div class="entry-grid">
          <div><label class="field-label">Alias Name</label><input class="form-control-custom" id="in_alias_name" /></div>
          <div class="span-2"><label class="field-label">Address Line 1</label><input class="form-control-custom" id="in_address_line1" /></div>
          <div class="span-2"><label class="field-label">Address Line 2</label><input class="form-control-custom" id="in_address_line2" /></div>
          <div><label class="field-label">City</label><input class="form-control-custom" id="in_city" /></div>
          <div><label class="field-label">Pincode</label><input class="form-control-custom" id="in_pincode" /></div>
          <div><label class="field-label">State Name</label><select class="form-control-custom" id="in_state_name"></select></div>
          <div><label class="field-label">GST No. <span id="gst-required-marker" style="color:var(--color-danger);">*</span></label><input class="form-control-custom" id="in_gst_no" placeholder="e.g. 33AAAAA0000A1Z5" /><div class="field-hint" id="in_gst_no_hint"></div></div>
          <div><label class="field-label">GST Type</label>
            <select class="form-control-custom" id="in_gst_type" data-options="gstRegistrationTypes"></select>
          </div>
          <div><label class="field-label">PAN No.</label><input class="form-control-custom" id="in_pan_no" placeholder="e.g. AAAAA0000A" /><div class="field-hint" id="in_pan_no_hint"></div></div>
          <div><label class="field-label">Maintain Balance Bill-by-Bill</label><input class="form-control-custom" id="in_bill_wise" placeholder="Yes / No" /></div>
        </div>
      </div>

      <!-- DEBTOR — UAE -->
      <div id="section-debtor-ae" style="display:none;">
        <div class="entry-section-title">Debtor Detail — UAE</div>
        <div class="entry-grid">
          <div><label class="field-label">Alias Name</label><input class="form-control-custom" id="ae_alias_name" /></div>
          <div class="span-2"><label class="field-label">Address Line 1</label><input class="form-control-custom" id="ae_address_line1" /></div>
          <div class="span-2"><label class="field-label">Address Line 2</label><input class="form-control-custom" id="ae_address_line2" /></div>
          <div><label class="field-label">Emirates</label>
            <select class="form-control-custom" id="ae_emirate" data-options="uaeEmirates"></select>
          </div>
          <div><label class="field-label">PO Box No.</label><input class="form-control-custom" id="ae_po_box_no" /></div>
          <div><label class="field-label">VAT TRN No.</label><input class="form-control-custom" id="ae_vat_trn_no" placeholder="e.g. 100234567800003" /></div>
          <div><label class="field-label">Trade License No.</label><input class="form-control-custom" id="ae_trade_license_no" /></div>
          <div><label class="field-label">Trade License Expiry</label><input class="form-control-custom" type="date" id="ae_trade_license_expiry" /></div>
        </div>
      </div>

      <!-- CREDITOR -->
      <div id="section-creditor" style="display:none;">
        <div class="entry-section-title">Creditor Detail</div>
        <div class="entry-grid">
          <div><label class="field-label">Creditor Type</label>
            <select class="form-control-custom" id="creditor_type" data-options="creditorTypes">
            </select>
          </div>
          <div><label class="field-label">Supplier Code</label><input class="form-control-custom" id="supplier_code" placeholder="e.g. SUP-001" /></div>
          <div><label class="field-label">Office ID</label><input class="form-control-custom" id="creditor_office_id" placeholder="e.g. OFF-001" /></div>
          <div><label class="field-label">Alias Name</label><input class="form-control-custom" id="cr_alias_name" /></div>
          <div class="span-2"><label class="field-label">Address Line 1</label><input class="form-control-custom" id="cr_address_line1" /></div>
          <div class="span-2"><label class="field-label">Address Line 2</label><input class="form-control-custom" id="cr_address_line2" /></div>
          <div><label class="field-label">City</label><input class="form-control-custom" id="cr_city" /></div>
          <div><label class="field-label">Pincode</label><input class="form-control-custom" id="cr_pincode" /></div>
          <div><label class="field-label">State Name</label><select class="form-control-custom" id="cr_state_name"></select></div>
          <div><label class="field-label">GST No.</label><input class="form-control-custom" id="cr_gst_no" placeholder="e.g. 33AAAAA0000A1Z5" /><div class="field-hint" id="cr_gst_no_hint"></div></div>
          <div><label class="field-label">GST Type</label>
            <select class="form-control-custom" id="cr_gst_type" data-options="gstRegistrationTypes"></select>
          </div>
          <div><label class="field-label">PAN No.</label><input class="form-control-custom" id="cr_pan_no" placeholder="e.g. AAAAA0000A" /><div class="field-hint" id="cr_pan_no_hint"></div></div>
          <div><label class="field-label">Maintain Balance Bill-by-Bill</label><input class="form-control-custom" id="cr_bill_wise" placeholder="Yes / No" /></div>
        </div>
      </div>

      <!-- INCOME / EXPENSE -->
      <div id="section-taxledger" style="display:none;">
        <div class="entry-section-title">Tax Settings</div>
        <div class="entry-grid">
          <div><label class="field-label">GST Applicable</label>
            <select class="form-control-custom" id="gst_applicable" data-options="yesNo"></select>
          </div>
          <div><label class="field-label">GST Percentage</label><input class="form-control-custom dom-amount dom-pct" type="text" inputmode="decimal" id="gst_percentage" value="0.00" /></div>
          <div><label class="field-label">TDS Applicable</label>
            <select class="form-control-custom" id="tds_applicable" data-options="yesNo"></select>
          </div>
          <div><label class="field-label">TDS Percentage</label><input class="form-control-custom dom-amount dom-pct" type="text" inputmode="decimal" id="tds_percentage" value="0.00" /></div>
          <div><label class="field-label">HSN Code</label><input class="form-control-custom" id="hsn_code" placeholder="e.g. 9985" /></div>
          <div><label class="field-label">TCS Applicable</label>
            <select class="form-control-custom" id="tcs_applicable" data-options="yesNo"></select>
          </div>
          <div><label class="field-label">TCS Percentage</label><input class="form-control-custom dom-amount dom-pct" type="text" inputmode="decimal" id="tcs_percentage" value="0.00" /></div>
        </div>
      </div>

      <!-- DUTIES & TAXES -->
      <div id="section-duties-taxes" style="display:none;">
        <div class="entry-section-title">Duty / Tax Detail</div>
        <div class="entry-grid">
          <div><label class="field-label">Tax Category</label>
            <select class="form-control-custom" id="tax_category" data-options="taxCategories">
              <option value="">Select...</option>
            </select>
          </div>
          <div id="tax-type-wrap" style="display:none;">
            <label class="field-label">Type of Tax</label>
            <select class="form-control-custom" id="tax_type" data-options="taxTypes">
            </select>
          </div>
        </div>
      </div>

      </div>

      <div class="entry-actions">
        <a href="accounts.html" class="dom-nav-btn" id="cancel-link">Cancel</a>
        <button type="submit" class="dom-nav-btn btn-primary" id="submit-btn">Save Ledger</button>
      </div>
    </form>
  </main>
</div>
<script src="assets/js/hardcode.js?v=2"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/api.js?v=4"></script>
<script src="assets/js/util.js?v=5"></script>
<script src="assets/js/shell.js?v=31"></script>
<script src="assets/js/entry-common.js"></script>
<script src="assets/js/page-ledger-entry.js?v=9"></script>
</body></html>
