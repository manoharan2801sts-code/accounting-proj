<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>New Hotel Booking — TRAVEL AGENCY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="assets/css/design-system.css" rel="stylesheet" />
<link href="assets/css/app.css" rel="stylesheet" />
<link href="assets/css/loader.css" rel="stylesheet" />
</head><body>
<script src="assets/js/loader.js?v=2"></script>
<header class="app-topnav" id="shell-topnav"></header>
<div class="app-body">
  <aside class="app-sidebar" id="shell-sidebar"></aside>
  <main class="app-main" style="max-width:1400px;">
    <h1 style="font-size:1.15rem;" id="page-title">New Hotel Booking</h1>
    <p class="text-muted-custom">Supplier cost vs. customer billing — profit shows live as you type.</p>
    <form id="hotel-form" style="margin-top:0.7rem;">
      <div class="entry-section-title">Booking detail</div>
      <div class="entry-grid">
        <div><label class="field-label">Branch</label><select class="form-control-custom" id="branch" required></select></div>
        <div><label class="field-label">Customer</label><select class="form-control-custom" id="customer" required></select></div>
        <div><label class="field-label">Supplier</label><select class="form-control-custom" id="supplier" required></select></div>
        <div><label class="field-label">Hotel</label><select class="form-control-custom" id="hotel_name" required></select></div>
        <div><label class="field-label">Guest Name</label><input class="form-control-custom" id="guest_name" required /></div>
        <div><label class="field-label">Status</label>
          <select class="form-control-custom" id="status"><option value="CONFIRMED">Confirmed</option><option value="CANCELLED">Cancelled</option></select>
        </div>
        <div><label class="field-label">Check-in</label><input class="form-control-custom calc" type="date" id="check_in" required /></div>
        <div><label class="field-label">Check-out</label><input class="form-control-custom calc" type="date" id="check_out" required /></div>
        <div><label class="field-label">Rooms</label><input class="form-control-custom" type="number" id="rooms" value="1" min="1" /></div>
      </div>

      <div class="entry-section-title">Cost &amp; billing</div>
      <div class="entry-grid">
        <div><label class="field-label">Supplier Cost</label><input class="form-control-custom calc" type="number" id="supplier_cost" value="0" min="0" step="0.01" /></div>
        <div><label class="field-label">Customer Billing</label><input class="form-control-custom calc" type="number" id="customer_billing" value="0" min="0" step="0.01" /></div>
        <div><label class="field-label">Profit</label><div class="computed-field" id="profit">—</div></div>
      </div>

      <div class="entry-actions">
        <a href="hotels.html" class="btn-outline-brand" id="cancel-link">Cancel</a>
        <button type="submit" class="btn-brand" id="submit-btn">Save Booking</button>
      </div>
    </form>
  </main>
</div>
<script src="assets/js/hardcode.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/shell.js?v=6"></script>
<script src="assets/js/entry-common.js"></script>
<script src="assets/js/page-hotel-entry.js"></script>
</body></html>
