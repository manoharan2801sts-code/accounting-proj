<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>New Insurance Policy — TRAVEL AGENCY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="assets/css/design-system.css" rel="stylesheet" />
<link href="assets/css/app.css" rel="stylesheet" />
</head><body>
<header class="app-topnav" id="shell-topnav"></header>
<div class="app-body">
  <aside class="app-sidebar" id="shell-sidebar"></aside>
  <main class="app-main" style="max-width:1400px;">
    <h1 style="font-size:1.15rem;" id="page-title">New Insurance Policy</h1>
    <p class="text-muted-custom">Policy tracking and supplier (underwriter) settlement.</p>
    <form id="insurance-form" style="margin-top:0.7rem;">
      <div class="entry-section-title">Policy detail</div>
      <div class="entry-grid">
        <div><label class="field-label">Branch</label><select class="form-control-custom" id="branch" required></select></div>
        <div><label class="field-label">Customer</label><select class="form-control-custom" id="customer" required></select></div>
        <div><label class="field-label">Underwriter (Supplier)</label><select class="form-control-custom" id="supplier" required></select></div>
        <div><label class="field-label">Policy No.</label><input class="form-control-custom" id="policy_no" required /></div>
        <div><label class="field-label">Insured Name</label><input class="form-control-custom" id="insured_name" required /></div>
        <div><label class="field-label">Status</label>
          <select class="form-control-custom" id="status"><option value="ACTIVE">Active</option><option value="CANCELLED">Cancelled</option><option value="CLAIMED">Claimed</option></select>
        </div>
        <div><label class="field-label">Policy Start</label><input class="form-control-custom" type="date" id="policy_start" required /></div>
        <div><label class="field-label">Policy End</label><input class="form-control-custom" type="date" id="policy_end" required /></div>
      </div>

      <div class="entry-section-title">Premium</div>
      <div class="entry-grid">
        <div><label class="field-label">Premium Cost</label><input class="form-control-custom" type="number" id="premium_cost" value="0" min="0" step="0.01" /></div>
        <div><label class="field-label">Premium Billed</label><input class="form-control-custom" type="number" id="premium_billed" value="0" min="0" step="0.01" /></div>
      </div>

      <div class="entry-actions">
        <a href="insurance.html" class="btn-outline-brand" id="cancel-link">Cancel</a>
        <button type="submit" class="btn-brand" id="submit-btn">Save Policy</button>
      </div>
    </form>
  </main>
</div>
<script src="assets/js/hardcode.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/shell.js?v=6"></script>
<script src="assets/js/entry-common.js"></script>
<script src="assets/js/page-insurance-entry.js"></script>
</body></html>
