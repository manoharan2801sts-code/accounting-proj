<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>DSR — Airline Ticket Booking — TRAVEL AGENCY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

  <style>
    /* Locked to the viewport - only the grid body scrolls, not the whole
       page (same pattern as ticket-entry.html/company-master.html). */
    html, body { height: 100%; overflow: hidden; margin: 0; }
    .dsr-main {
      display: flex; flex-direction: column;
      height: calc(100vh - var(--topnav-height) - var(--menubar-height, 0px));
      padding: 1.5rem 2rem; box-sizing: border-box;
    }
    /* A single compact toolbar row - date/product/category/travel-type
       fields sized/aligned to match the plain Print/Export CSV buttons (no
       stacked label-above-input block, no 34px-tall oversized controls),
       Print/Export pushed to the far right via the margin-left:auto spacer -
       same pattern as report-trial-balance.html/report-cash-bank-book.html.
       Customer/Supplier chip pickers can grow tall once a few chips are
       picked, so they stay on their own row directly underneath instead of
       wrapping into the same line as the short one-line fields above. */
    .page-header-row { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.25rem; flex-shrink: 0; position: relative; }
    /* Floats over the table as a real dropdown instead of pushing it down
       the page when opened/closed - anchored to the toolbar row itself so
       it drops down right under the "Advanced Filter" button. */
    #dsr-advanced-panel {
      position: absolute; top: 100%; left: 0; margin-top: 6px; z-index: 30;
      background: var(--color-white); border: 1px solid var(--color-border); border-radius: var(--radius-md);
      box-shadow: var(--shadow-md); padding: 0.75rem 1rem;
    }
    .dsr-toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; width: 100%; }
    /* Customer/Supplier chip pickers grow taller as chips are added (each
       wraps onto its own line below the search box) - align everything
       in this row to the top instead of centering, so Product/Category/
       Type/the "+ ..." button don't visually drift out of line with a
       picker that's grown taller than them. */
    #dsr-advanced-panel .dsr-toolbar { align-items: flex-start; }
    .dsr-toolbar-label { font-size: 11px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em; }
    .dsr-toolbar-date, .dsr-toolbar-select { height: 26px; padding: 0 6px; font-size: 12px; box-sizing: border-box; }
    .dsr-toolbar-date { width: 116px; }
    .dsr-toolbar-select { width: 150px; }
    #dsr-advanced-chevron { transition: transform var(--t-fast); }
    #dsr-advanced-toggle-btn.is-open #dsr-advanced-chevron { transform: rotate(180deg); }
    #dsr-clear-filters-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    /* Customer/Supplier sit inline in the same toolbar row as Product/
       Category/Type now (no separate toggle/row) - narrowed down from
       the chip-picker's usual 320px so they fit alongside everything
       else; chips still wrap onto their own line underneath once picked. */
    .dsr-inline-picker .chip-picker-input-wrap { max-width: 150px; }
    .dsr-inline-picker .chip-chips { max-width: 150px; }

    /* Chip picker (used for both Customer and Supplier) - starts as an
       empty search box; typing (or just focusing it) opens a dropdown of
       matching names below, click to add one as a removable chip. Multiple
       values can be picked. */
    .chip-picker-input-wrap { position: relative; max-width: 320px; }
    .chip-picker-input-wrap input { width: 100% !important; }
    .chip-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; max-width: 220px; }
    .chip-chips:empty { display: none; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--color-primary-light); border-radius: 3px; background: var(--color-primary-tint);
      padding: 0.25rem 0.5rem; font-size: 12px; font-weight: 700; color: var(--color-primary);
    }
    .chip .chip-remove { cursor: pointer; font-weight: 700; line-height: 1; }
    .chip .chip-remove:hover { color: var(--color-danger); }
    .chip-dropdown {
      /* Anchored to the input's own wrapper only (not the whole picker),
         so it always sits directly under the search box instead of
         drifting further down as more chips get added below. */
      display: none; position: absolute; top: 100%; left: 0; margin-top: 2px; width: 220px; z-index: 20;
      background: var(--color-white); border: 1px solid var(--color-border); border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md); max-height: 180px; overflow-y: auto;
    }
    .chip-picker.open .chip-dropdown { display: block; }
    .chip-option { padding: 0.45rem 0.7rem; font-size: 12.5px; font-weight: 600; color: var(--color-text-dark); cursor: pointer; }
    .chip-option:hover { background: var(--color-primary); color: #FFFFFF; }
    .chip-option.is-selected { color: var(--color-text-faint); background: var(--color-bg-subtle); }
    .chip-option.is-selected:hover { background: var(--color-primary); color: #FFFFFF; }
    .chip-dropdown-empty { padding: 0.5rem 0.7rem; font-size: 12px; color: var(--color-text-muted); }

    .table-container {
      background: var(--color-white); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); overflow: hidden;
      flex: 1; min-height: 0; display: flex; flex-direction: column;
    }
    .table-toolbar {
      padding: 0.5rem 1rem; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--color-border); gap: 1rem; flex-wrap: wrap; background: #FAFBFD;
    }
    .table-search { max-width: 220px; width: 100%; height: 26px; font-size: 11.5px; padding: 0 0.5rem; }
    .table-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: auto; }
    .table-custom { width: 100%; border-collapse: collapse; text-align: left; }
    .table-custom th { padding: 0.35rem 0.75rem; background: #F8FAFC; border-bottom: 1px solid var(--color-border);
      font-size: 10.5px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em;
      position: sticky; top: 0; z-index: 1; }
    .table-custom td {
      padding: 0.2rem 0.75rem; border-bottom: 1px solid var(--color-border-subtle);
      font-size: 12px; color: var(--color-text); vertical-align: middle; line-height: 1.3;
    }
    /* No column ever wraps - every row stays exactly one line tall.
       Short columns (dates/PNR/amounts) just grow to fit; the few that
       can carry long text (Sector/Airline/Pax Name/Supplier/Customer)
       additionally get .truncate-cell (capped width + ellipsis), with
       the untruncated value shown via the title tooltip on hover. */
    .table-custom td { white-space: nowrap; }
    .table-custom td.truncate-cell {
      max-width: 160px; overflow: hidden; text-overflow: ellipsis;
    }
    .table-custom tbody tr.dsr-data-row.dsr-row-selected td { background: var(--color-primary); color: #FFFFFF; }
    .table-custom tbody tr:last-child td { border-bottom: none; }
    .table-custom tbody tr.dsr-data-row { cursor: pointer; }
    .status-badge { display: inline-flex; align-items: center; padding: 0.2rem 0.55rem;
      border-radius: 4px; font-size: 11.5px; font-weight: 700; }
    .badge-issued, .badge-success { background: #DCFCE7; color: #166534; }
    .badge-pending, .badge-warning { background: #FEF3C7; color: #92400E; }
    .badge-cancelled, .badge-danger { background: #FEE2E2; color: #991B1B; }
    .badge-rescheduled, .badge-info { background: #E0E7FF; color: #3730A3; }
    
    .amt { font-family: var(--font-mono); font-weight: 600; text-align: right; }
    th.amt-header { text-align: right; }
  </style>
</head>
<body>
<script src="assets/js/loader.js?v=2"></script>

  <div class="app-body">
    <main class="app-main dsr-main" style="max-width: 1440px; margin: 0 auto;">

          <button type="button" class="dom-nav-btn" id="dsr-advanced-toggle-btn" onclick="toggleAdvancedFilter()">

            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="dsr-advanced-chevron"><polyline points="6 9 12 15 18 9"/></svg>
          </button>

          <span style="margin-left:auto;"></span>
          <button type="button" class="dom-nav-btn" onclick="window.print()">

              <option value="">All Products</option>

  <script src="assets/js/hardcode.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/util.js"></script>
  <script src="assets/js/entry-common.js"></script>
  <script src="assets/js/shell.js"></script>
  <script>
    // Not gated on DOMContentLoaded - when this page is opened via the
    // app's SPA navigation (shell.js's navigateTo), its <script> tags are
    // injected into a document that already finished loading long ago, so
    // DOMContentLoaded has already fired and never fires again. Gating
    // init on it meant loadReport() silently never ran except on a hard
    // refresh, matching every other page's plain top-level async IIFE.
    //
    // Wrapped in an IIFE (unlike a naive top-level script) because
    // shell.js re-executes this exact block every time this page is
    // navigated to - a second execution's top-level `let`/`const` in the
    // SAME document throws "Identifier has already been declared" (a
    // classic-script global lexical environment persists across separately
    // executed <script> tags), which silently aborts the whole block and
    // leaves the page stuck on its static "Loading..." forever until a
    // hard refresh starts the document fresh. Functions the page's own
    // onclick="..." attributes call are exposed on window explicitly,
    // since they're no longer implicitly global once wrapped.
    (function () {
    let activeCompanyId;
    (async function initDsrPage() {
      try {
        const active = await VoyagerShell.init({ activeKey: "rep-dsr" });
        if (active) activeCompanyId = Number(active.id);
        await VoyagerUtil.loadDecimalPlaces(activeCompanyId);
      } catch (err) {
        console.error("Shell init failed", err);
      }
      // Defaults to today, not a wide static range - this project posts a
      // lot of tickets per day, so a multi-week default window would be
      // slow/overwhelming to load on first open. But if we got here via
      // "Back" from a ticket opened off this report (ticket-entry.js's
      // Back link is just document.referrer, which syncUrlWithFilters()
      // below keeps up to date), restore whatever From/To was actually
      // showing instead of silently resetting to today.
      const urlParams = new URLSearchParams(window.location.search);
      const todayStr = new Date().toISOString().slice(0, 10);
      document.getElementById("filter-from").value = urlParams.get("from") || todayStr;
      document.getElementById("filter-to").value = urlParams.get("to") || todayStr;
      loadReport();
    })();

    // Double-click a row to open that ticket in ticket-entry.html, read-only
    // (view mode) - passing ?id=<ticket id> is all it takes; ticket-entry.js
    // loads that ticket and renders it via enterViewMode() automatically.
    document.getElementById("main-data-tbody").addEventListener("dblclick", (e) => {
      const row = e.target.closest(".dsr-data-row");
      if (!row) return;
      window.location.href = `ticket-entry.html?id=${row.dataset.id}`;
    });

    // ============================================================
    // Keyboard row navigation - Up/Down moves a highlighted "current
    // row" (same look as mouse hover), Enter opens it, same as a
    // double-click. Ignored while typing in any filter/search field so
    // arrow keys there still move the text cursor as normal.
    // ============================================================
    let selectedRowIndex = -1;
    function visibleDataRows() {
      return Array.from(document.querySelectorAll("#main-data-tbody tr.dsr-data-row")).filter((r) => r.style.display !== "none");
    }
    function selectRow(index) {
      const rows = visibleDataRows();
      rows.forEach((r) => r.classList.remove("dsr-row-selected"));
      if (!rows.length) { selectedRowIndex = -1; return; }
      selectedRowIndex = Math.max(0, Math.min(index, rows.length - 1));
      const row = rows[selectedRowIndex];
      row.classList.add("dsr-row-selected");
      row.scrollIntoView({ block: "nearest" });
    }
    // Keeps the keyboard-selected row in sync with whatever the mouse is
    // actually over - without this, moving the mouse to hover a different
    // row while an old keyboard selection is still stuck elsewhere made it
    // look like hover had stopped working (two rows lit up at once).
    document.getElementById("main-data-tbody").addEventListener("mouseover", (e) => {
      const row = e.target.closest("tr.dsr-data-row");
      if (!row) return;
      const idx = visibleDataRows().indexOf(row);
      if (idx !== -1) selectRow(idx);
    });
    document.addEventListener("keydown", (e) => {
      if (!["ArrowDown", "ArrowUp", "Enter"].includes(e.key)) return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (["INPUT", "SELECT", "TEXTAREA"].includes(tag)) return;
      const rows = visibleDataRows();
      if (!rows.length) return;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        selectRow(selectedRowIndex < rows.length - 1 ? selectedRowIndex + 1 : 0);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        selectRow(selectedRowIndex > 0 ? selectedRowIndex - 1 : rows.length - 1);
      } else if (e.key === "Enter" && selectedRowIndex >= 0) {
        e.preventDefault();
        window.location.href = `ticket-entry.html?id=${rows[selectedRowIndex].dataset.id}`;
      }
    });

    // ============================================================
    // Real report data - one row per Airline TicketLine, pulled straight
    // from the Django backend (same /api/tickets/ endpoint ticket-entry.js
    // and tickets.html already use).
    // ============================================================
    const TICKETS_API = `${window.API_BASE || "/api"}/tickets/`;
    let allRows = [];

    function fmtAmt(n) {
      const d = VoyagerUtil.getDecimalPlaces();
      return "₹" + (Number(n) || 0).toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
    }

    function populateReferenceFilters() {
      CUSTOMER_OPTIONS = [...new Set(allRows.map((r) => r.customer_name).filter(Boolean))].sort();
      SUPPLIER_OPTIONS = [...new Set(allRows.map((r) => r.supplier_name).filter(Boolean))].sort();
    }

    function escAttr(str) {
      return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
    }

    // One row per Invoice/Ticket, not per passenger - allRows is still
    // one row per TicketLine (straight from /api/tickets/), so multi-
    // passenger tickets get folded here: Pax Name shows the lead (first)
    // passenger, Airline/Supplier show every distinct value across that
    // ticket's passengers, and the amount columns are summed across all
    // of them.
    function groupRowsByTicket(rows) {
      const byTicket = new Map();
      rows.forEach((r) => {
        let g = byTicket.get(r.ticket_id);
        if (!g) {
          g = {
            ticket_id: r.ticket_id, invoice_date: r.invoice_date, invoice_number: r.invoice_number,
            customer_name: r.customer_name, booking_reference: r.booking_reference, airline_pnr: r.airline_pnr,
            lead_passenger_name: r.passenger_name, airline_names: [], supplier_names: [], sectors: [],
            basic_fare: 0, other_tax: 0, net_amount: 0,
          };
          byTicket.set(r.ticket_id, g);
        }
        const airline = r.airline_name || r.airline_code;
        if (airline && !g.airline_names.includes(airline)) g.airline_names.push(airline);
        if (r.supplier_name && !g.supplier_names.includes(r.supplier_name)) g.supplier_names.push(r.supplier_name);
        // A multi-city passenger's own sector is already comma-joined
        // (e.g. "BOM-DXB,DXB-COK") - split those out too so each leg only
        // ever appears once across the whole ticket, same de-dup as Airline/Supplier.
        (r.sector || "").split(",").map((s) => s.trim()).filter(Boolean).forEach((s) => {
          if (!g.sectors.includes(s)) g.sectors.push(s);
        });
        g.basic_fare += Number(r.basic_fare) || 0;
        // Other Tax = ticket-entry.html's Summary strip, both rows added
        // together (see recalcSummary() in page-ticket-entry.js): Sales
        // Cost's Taxes (YQ+YR+K3+Tax & Others) + SSR (Seat+Meal+Baggage+
        // Other SSR) - Discount + TDS + Markup (+Addl+SSR) + Service Fee
        // (+Addl+SSR) + GST Amount, PLUS Purchase Cost's own Markup
        // (+Addl) + Service Fee (+Addl) + GST Amount. Discount/TDS/GST
        // come straight from the backend's own computed_discount/
        // computed_tds/computed_gst/computed_supp_gst (Master Mapping-
        // driven), not re-derived here.
        const taxes = (Number(r.yq) || 0) + (Number(r.yr) || 0) + (Number(r.k3_tax) || 0) + (Number(r.tax_others) || 0);
        const ssr = (Number(r.seat) || 0) + (Number(r.meal) || 0) + (Number(r.baggage) || 0) + (Number(r.other_ssr) || 0);
        const markup = (Number(r.markup) || 0) + (Number(r.addl_markup) || 0) + (Number(r.ssr_markup) || 0);
        const serviceFee = (Number(r.service_fee) || 0) + (Number(r.addl_service_fee) || 0) + (Number(r.ssr_service_fee) || 0);
        const suppMarkup = (Number(r.supp_markup) || 0) + (Number(r.supp_addl_markup) || 0);
        const suppServiceFee = (Number(r.supp_service_fee) || 0) + (Number(r.supp_addl_service_fee) || 0);
        const lineOtherTax = taxes + ssr - (Number(r.computed_discount) || 0)
          + (Number(r.computed_tds) || 0) + markup + serviceFee + (Number(r.computed_gst) || 0)
          + suppMarkup + suppServiceFee + (Number(r.computed_supp_gst) || 0);
        g.other_tax += lineOtherTax;
      });
      byTicket.forEach((g) => {
        g.other_tax = Math.round(g.other_tax * 100) / 100;
        g.net_amount = Math.round((g.basic_fare + g.other_tax) * 100) / 100;
      });
      return Array.from(byTicket.values());
    }

    function renderTable(rows) {
      const tbody = document.getElementById("main-data-tbody");
      selectedRowIndex = -1; // stale after a full re-render - rows are new DOM nodes
      const tickets = groupRowsByTicket(rows);
      if (!tickets.length) {
        tbody.innerHTML = `<tr><td colspan="12" style="text-align:center; padding:2rem; color:var(--color-text-muted);">No records found for the selected filters.</td></tr>`;
        return;
      }
      tbody.innerHTML = tickets.map((t) => `
        <tr class="dsr-data-row" data-id="${t.ticket_id}" title="Double-click to view this ticket">
          <td>${t.invoice_date || "-"}</td>
          <td>${t.invoice_number || "-"}</td>
          <td class="truncate-cell" title="${escAttr(t.customer_name || "-")}">${t.customer_name || "-"}</td>
          <td>${t.booking_reference || "-"}</td>
          <td>${t.airline_pnr || "-"}</td>
          <td class="truncate-cell" title="${escAttr(t.lead_passenger_name || "-")}">${t.lead_passenger_name || "-"}</td>
          <td class="truncate-cell" title="${escAttr(t.sectors.join(", ") || "-")}">${t.sectors.join(", ") || "-"}</td>
          <td class="truncate-cell" title="${escAttr(t.airline_names.join(", ") || "-")}">${t.airline_names.join(", ") || "-"}</td>
          <td class="truncate-cell" title="${escAttr(t.supplier_names.join(", ") || "-")}">${t.supplier_names.join(", ") || "-"}</td>
          <td class="amt">${fmtAmt(t.basic_fare)}</td>
          <td class="amt">${fmtAmt(t.other_tax)}</td>
          <td class="amt">${fmtAmt(t.net_amount)}</td>
        </tr>
      `).join("");
    }

    // Keeps the address bar's From/To in sync with the toolbar, so
    // document.referrer (what ticket-entry.js's "Back" link uses when you
    // open a ticket from here) always points back to this exact filtered
    // view instead of a bare URL that resets to today on return.
    function syncUrlWithFilters() {
      const params = new URLSearchParams();
      const fromDate = document.getElementById("filter-from").value;
      const toDate = document.getElementById("filter-to").value;
      if (fromDate) params.set("from", fromDate);
      if (toDate) params.set("to", toDate);
      const qs = params.toString();
      history.replaceState(null, "", qs ? `${window.location.pathname}?${qs}` : window.location.pathname);
    }

    function applyFiltersAndRender() {
      syncUrlWithFilters();
      const fromDate = document.getElementById("filter-from").value;
      const toDate = document.getElementById("filter-to").value;
      const product = document.getElementById("filter-product").value;
      const category = document.getElementById("filter-airline-category").value;
      const travelType = document.getElementById("filter-travel-type").value;
      const pickedCustomers = customerPicker.getSelected();
      const pickedSuppliers = supplierPicker.getSelected();

      // This report only has Airline ticket line data - any other Product
      // selection has nothing to show here.
      if (product && product !== "Airline") {
        renderTable([]);
        return;
      }

      const rows = allRows.filter((r) => {
        if (fromDate && r.invoice_date && r.invoice_date < fromDate) return false;
        if (toDate && r.invoice_date && r.invoice_date > toDate) return false;
        if (pickedCustomers.length && !pickedCustomers.includes(r.customer_name)) return false;
        if (pickedSuppliers.length && !pickedSuppliers.includes(r.supplier_name)) return false;
        if (category && r.airline_category !== category) return false;
        if (travelType && r.travel_type !== travelType) return false;
        return true;
      });
      renderTable(rows);
    }

    async function loadReport() {
      const tbody = document.getElementById("main-data-tbody");
      try {
        const res = await fetch(`${TICKETS_API}?company_id=${activeCompanyId}`);
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        allRows = data.map((l) => ({ ...l, pnr: l.airline_pnr || l.gds_pnr || l.booking_reference }));
      } catch (err) {
        console.error("Could not load tickets for the DSR report - is the Django backend running?", err);
        allRows = [];
        tbody.innerHTML = `<tr><td colspan="11" style="text-align:center; padding:2rem; color:var(--color-text-muted);">Could not load data. Is the Django backend running on localhost:8000?</td></tr>`;
        return;
      }
      populateReferenceFilters();
      applyFiltersAndRender();
    }

    // ============================================================
    // Chip picker - reusable for both Customer and Supplier filters. An
    // empty search box; typing/focusing opens a dropdown of matching names
    // (loaded from the real report data above), click one to add it as a
    // removable chip. Multiple values can be picked per field.
    // ============================================================
    let CUSTOMER_OPTIONS = [];
    let SUPPLIER_OPTIONS = [];

    function createChipPicker({ pickerEl, searchEl, chipsEl, dropdownEl, getOptions }) {
      let selected = [];

      function renderDropdown() {
        const q = searchEl.value.trim().toLowerCase();
        const matches = getOptions().filter((name) => name.toLowerCase().includes(q));
        dropdownEl.innerHTML = matches.length
          ? matches.map((name) => {
              const isSelected = selected.includes(name);
              return `<div class="chip-option ${isSelected ? "is-selected" : ""}" data-name="${name}">${name}</div>`;
            }).join("")
          : `<div class="chip-dropdown-empty">No matches</div>`;
      }

      function renderChips() {
        chipsEl.innerHTML = selected.map((name) => `
          <span class="chip" data-name="${name}">
            ${name}<span class="chip-remove" title="Remove">&times;</span>
          </span>
        `).join("");
      }

      searchEl.addEventListener("focus", () => {
        pickerEl.classList.add("open");
        renderDropdown();
      });
      searchEl.addEventListener("input", renderDropdown);
      // Enter is the deliberate "I'm done picking" action - stays open
      // through any number of picks otherwise, closing only on Enter or
      // an actual click outside (see the composedPath() listener below).
      searchEl.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        pickerEl.classList.remove("open");
        searchEl.blur();
      });

      dropdownEl.addEventListener("click", (e) => {
        const opt = e.target.closest(".chip-option");
        if (!opt || opt.classList.contains("is-selected")) return;
        selected.push(opt.dataset.name);
        renderChips();
        // Keep whatever was typed so the remaining matches for that search
        // stay visible - clearing it made the list look empty right after
        // picking one, instead of showing the other matches still available.
        renderDropdown();
        searchEl.focus();
        updateClearFiltersState();
      });

      chipsEl.addEventListener("click", (e) => {
        const remove = e.target.closest(".chip-remove");
        if (!remove) return;
        const name = remove.closest(".chip").dataset.name;
        selected = selected.filter((n) => n !== name);
        renderChips();
        renderDropdown();
        updateClearFiltersState();
      });

      document.addEventListener("click", (e) => {
        // composedPath(), not pickerEl.contains(e.target) - picking an
        // option calls renderDropdown() first (replacing dropdownEl's
        // innerHTML, including the very .chip-option node just clicked)
        // and THEN this bubbles up here. By then e.target is already a
        // detached node, so .contains() always says "outside" and
        // immediately closed the dropdown right after each pick -
        // meaning only one customer/supplier could ever be picked before
        // having to click back into the search box. composedPath()
        // captures the real ancestor chain at dispatch time, unaffected
        // by that DOM replacement.
        if (!e.composedPath().includes(pickerEl)) pickerEl.classList.remove("open");
      });

      return {
        getSelected: () => selected,
        clear: () => { selected = []; renderChips(); renderDropdown(); },
      };
    }

    const customerPicker = createChipPicker({
      pickerEl: document.getElementById("customer-picker"),
      searchEl: document.getElementById("customer-search"),
      chipsEl: document.getElementById("customer-chips"),
      dropdownEl: document.getElementById("customer-dropdown"),
      getOptions: () => CUSTOMER_OPTIONS,
    });
    const supplierPicker = createChipPicker({
      pickerEl: document.getElementById("supplier-picker"),
      searchEl: document.getElementById("supplier-search"),
      chipsEl: document.getElementById("supplier-chips"),
      dropdownEl: document.getElementById("supplier-dropdown"),
      getOptions: () => SUPPLIER_OPTIONS,
    });

    // Advanced Filter's "Clear" button - disabled until something is
    // actually different from the default (Product = Airline, everything
    // else empty); resets all of it back to that default and re-renders.
    function updateClearFiltersState() {
      const btn = document.getElementById("dsr-clear-filters-btn");
      if (!btn) return;
      const anyActive = document.getElementById("filter-product").value !== "Airline"
        || document.getElementById("filter-airline-category").value
        || document.getElementById("filter-travel-type").value
        || customerPicker.getSelected().length
        || supplierPicker.getSelected().length;
      btn.disabled = !anyActive;
    }
    function clearAdvancedFilters() {
      document.getElementById("filter-product").value = "Airline";
      document.getElementById("filter-airline-category").value = "";
      document.getElementById("filter-travel-type").value = "";
      customerPicker.clear();
      supplierPicker.clear();
      toggleAirlineOnlyFilters();
      updateClearFiltersState();
      applyFiltersAndRender();
    }

    function exportCSV() {
      let csv = [];
      const rows = document.querySelectorAll("#main-data-table tr");
      rows.forEach(row => {
        let cols = Array.from(row.querySelectorAll("th, td")).map(td => `"${td.innerText.replace(/"/g, '""')}"`);
        csv.push(cols.join(","));
      });
      const blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "rep-dsr-airline-booking.csv";
      link.click();
    }

    // Advanced Filter - two-step reveal. Step 1 (Advanced Filter button)
    // shows Product/Category/Travel Type; step 2 (+ Customer/Supplier,
    // only reachable once step 1 is open) shows the chip pickers. Both
    // stay collapsed by default so the toolbar starts as just From/To.
    // Airline Category/Travel Type only make sense for Product = Airline
    // (every other product has neither) - hidden for any other pick,
    // including "All Products".
    function toggleAirlineOnlyFilters() {
      const isAirline = document.getElementById("filter-product").value === "Airline";
      document.getElementById("dsr-airline-only-filters").style.display = isAirline ? "" : "none";
    }

    function toggleAdvancedFilter() {
      const panel = document.getElementById("dsr-advanced-panel");
      const btn = document.getElementById("dsr-advanced-toggle-btn");
      const isOpen = panel.style.display !== "none";
      panel.style.display = isOpen ? "none" : "";
      btn.classList.toggle("is-open", !isOpen);
    }
    // Click anywhere outside the (now floating, dropdown-style) panel
    // closes it - same convention as the Customer/Supplier chip pickers.
    document.addEventListener("click", (e) => {
      const panel = document.getElementById("dsr-advanced-panel");
      const btn = document.getElementById("dsr-advanced-toggle-btn");
      if (!panel || panel.style.display === "none") return;
      // composedPath(), not .contains(e.target) - picking a customer/
      // supplier chip re-renders that dropdown's innerHTML (destroying
      // the very option node just clicked) before this bubbles up here,
      // so .contains() always saw it as "outside" and closed the WHOLE
      // Advanced Filter panel on every single pick.
      const path = e.composedPath();
      if (path.includes(panel) || path.includes(btn)) return;
      panel.style.display = "none";
      btn.classList.remove("is-open");
    });
    // Table-toolbar search box - plain client-side text match over
    // whatever applyFiltersAndRender() already rendered (same convention
    // as report-trial-balance.html/report-cash-bank-book.html).
    function filterTable(query) {
      const q = query.toLowerCase();
      const rows = document.querySelectorAll("#main-data-tbody tr");
      rows.forEach((r) => {
        r.style.display = r.textContent.toLowerCase().includes(q) ? "" : "none";
      });
    }

    // Called from onclick="..." attributes above, which always run in the
    // real global scope regardless of this IIFE.
    window.exportCSV = exportCSV;
    window.applyFiltersAndRender = applyFiltersAndRender;
    window.filterTable = filterTable;
    window.toggleAdvancedFilter = toggleAdvancedFilter;
    window.toggleAirlineOnlyFilters = toggleAirlineOnlyFilters;
    window.updateClearFiltersState = updateClearFiltersState;
    window.clearAdvancedFilters = clearAdvancedFilters;
    toggleAirlineOnlyFilters();
    })();
  </script>
</body>
</html>
