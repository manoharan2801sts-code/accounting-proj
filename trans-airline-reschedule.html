<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Airline Ticket — Reschedule — TRAVEL AGENCY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="assets/css/design-system.css" rel="stylesheet" />
  <link href="assets/css/app.css" rel="stylesheet" />
<link href="assets/css/loader.css?v=3" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <style>
    /* Locked to the viewport - only the table body inside each card
       scrolls, not the whole page - so the Reschedule button at the
       bottom is always pinned in view instead of getting pushed off the
       bottom of the screen on a shorter window (same pattern as
       report-trial-balance.html/ticket-entry.html). */
    html, body { height: 100%; overflow: hidden; margin: 0; }
    .rs-main {
      display: flex; flex-direction: column;
      height: calc(100vh - var(--topnav-height) - var(--menubar-height, 0px));
      box-sizing: border-box;
    }
    .rs-main .page-header-row, .rs-main .breadcrumb, .rs-main .filter-card { flex-shrink: 0; }
    /* Takes whatever vertical space is left after the header/search card/
       Reschedule button - the two cards then stretch to fill THAT (see
       .rs-card-fixed's max-height below), so they only get as tall as
       430px actually lets them on a roomy window, and shrink (scrolling
       internally past that) on a shorter one, instead of ever pushing
       the Reschedule button below the fold. */
    .rs-main #rs-selection-row { flex: 1; min-height: 0; }
    .rs-main #rs-reschedule-row { flex-shrink: 0; }

    .page-header-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .page-title-group h1 { font-size: 0.92rem; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
    .page-title-group .breadcrumb { font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 0.25rem; display: flex; gap: 0.4rem; align-items: center; }
    
    .filter-card {
      background: var(--color-white); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: 1rem 1.25rem; margin-bottom: 1.25rem;
      display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap;
    }
    .filter-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .filter-group label { font-size: 11px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em; }

    .table-container {
      background: var(--color-white); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); overflow: hidden;
    }
    .table-toolbar {
      padding: 0.85rem 1.25rem; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--color-border); gap: 1rem; flex-wrap: wrap; background: #FAFBFD;
    }
    /* Fixed, equal height for the Passengers/Sectors cards (sized for the
       most rows either one ever needs - max 9 passengers per ticket) -
       the table body scrolls internally past that instead of the card
       growing taller than its twin. */
    .rs-card-fixed { display: flex; flex-direction: column; min-height: 0; max-height: 430px; }
    .rs-card-scroll { flex: 1; min-height: 0; overflow-y: auto; }
    .table-custom { width: 100%; border-collapse: collapse; text-align: left; }
    .table-custom th { padding: 0.75rem 1rem; background: #F8FAFC; border-bottom: 1px solid var(--color-border);
      font-size: 11.5px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em;
      position: sticky; top: 0; z-index: 1; }
    .table-custom td {
      padding: 0.75rem 1rem; border-bottom: 1px solid var(--color-border-subtle);
      font-size: 13px; color: var(--color-text); vertical-align: middle;
    }
    #rs-reschedule-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .table-custom tbody tr:hover { background: #F8FAFC; }
    .table-custom tbody tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>
<script src="assets/js/loader.js?v=3"></script>
  <header class="app-topnav" id="shell-topnav"></header>
  <div class="app-body">
    <main class="app-main rs-main" style="max-width: 1440px; margin: 0 auto; padding: 1.5rem 2rem; width: 100%;">
      <div class="page-header-row">
        <div class="page-title-group">
          <div class="breadcrumb">Transactions &rsaquo; Airline Ticket &rsaquo; Reschedule</div>
          <h1>Airline Ticket — Reschedule</h1>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button type="button" class="dom-nav-btn" onclick="window.print()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2m-12 0v4h12v-4"/></svg>
            Print
          </button>
        </div>
      </div>

      <!-- Find the real ticket to reschedule - S PNR/Airline PNR/Ticket No
           are alternate ways to identify the same ticket, fill in
           whichever one you have (see ticket_lookup_for_reschedule in
           views.py for the lookup priority). -->
      <div class="filter-card">
        <div class="filter-group">
          <label>S PNR</label>
          <input type="text" class="form-control-custom" id="rs-search-spnr" placeholder="Booking Reference" autocomplete="off" style="height:34px;" />
        </div>
        <div class="filter-group">
          <label>Airline PNR</label>
          <input type="text" class="form-control-custom" id="rs-search-airline-pnr" placeholder="Airline PNR" autocomplete="off" style="height:34px;" />
        </div>
        <div class="filter-group">
          <label>Ticket No</label>
          <input type="text" class="form-control-custom" id="rs-search-ticket-no" placeholder="Ticket No" autocomplete="off" style="height:34px;" />
        </div>
        <button type="button" class="dom-nav-btn btn-primary" style="height:34px;" id="rs-get-btn">Get</button>
      </div>

      <!-- Left: this ticket's passengers (checkbox to pick who's being
           rescheduled). Right: the checked passenger(s)' own sectors
           (checkbox to pick which specific sector). Hidden until Get
           actually finds a ticket. Both cards are a fixed, equal height
           (a ticket can have at most 9 passengers, so that's the most
           rows either one ever needs to show without scrolling) - the
           table body scrolls internally past that instead of the card
           growing taller than its twin. -->
      <div id="rs-selection-row" style="display:none; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;">
        <div class="table-container rs-card-fixed">
          <div class="table-toolbar">
            <div style="font-weight:700; font-size:0.92rem; color:var(--color-text-dark);">Passengers</div>
          </div>
          <div class="rs-card-scroll">
            <table class="table-custom">
              <thead>
                <tr><th style="width:36px;"></th><th>Pax Type</th><th>Pax Name</th></tr>
              </thead>
              <tbody id="rs-pax-tbody"></tbody>
            </table>
          </div>
        </div>
        <div class="table-container rs-card-fixed">
          <div class="table-toolbar">
            <div style="font-weight:700; font-size:0.92rem; color:var(--color-text-dark);">Sectors</div>
          </div>
          <div class="rs-card-scroll">
            <table class="table-custom">
              <thead>
                <tr><th style="width:36px;"></th><th>Sector</th><th>Flight No</th><th>Class</th><th>Date</th></tr>
              </thead>
              <tbody id="rs-sector-tbody">
                <tr><td colspan="5" style="text-align:center; padding:1.5rem; color:var(--color-text-muted);">Select a passenger to see their sectors.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="rs-reschedule-row" style="display:none; flex-direction:column; align-items:center; gap:0.35rem; margin-bottom:1.5rem;">
        <button type="button" class="dom-nav-btn btn-primary" id="rs-reschedule-btn" style="height:38px; padding:0 28px; font-size:13px;" disabled>Reschedule</button>
        <span style="font-size:11px; color:var(--color-text-muted);">Reschedule with Selected Passenger</span>
      </div>

    </main>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/hardcode.js"></script>
  <script src="assets/js/shell.js"></script>
  <script>
    // Not gated on DOMContentLoaded - this page's <script> can be injected
    // by the app's SPA navigation (shell.js's navigateTo) into a document
    // that already finished loading, so DOMContentLoaded never fires again
    // and this would silently never run except on a hard refresh.
    //
    // Wrapped in an IIFE (unlike a naive top-level script) because
    // shell.js re-executes this exact block every time this page is
    // navigated to - a second execution's top-level `let`/`const` in the
    // SAME document throws "Identifier has already been declared" (a
    // classic-script global lexical environment persists across separately
    // executed <script> tags), which silently aborts the whole block.
    // Functions the page's own onclick="..." attributes call are exposed
    // on window explicitly, since they're no longer implicitly global
    // once wrapped.
    (function () {
    let activeCompanyId;

    (async function init() {
      try {
        const active = await VoyagerShell.init({ activeKey: "trans-airline-reschedule" });
        if (active) activeCompanyId = Number(active.id);
      } catch (err) {
        console.error("Shell init failed", err);
      }
    })();

    // ============================================================
    // Find a real ticket (by S PNR / Airline PNR / Ticket No) and show
    // its passengers + their sectors, each pickable via checkbox.
    // ============================================================
    let lookupPassengers = [];
    let lookupMatchedLineId = null;
    let lookupTicketId = null;

    async function lookupTicketForReschedule() {
      // Falls back to reading the topnav's own company switcher directly
      // instead of just giving up - VoyagerShell.init() can leave
      // activeCompanyId unset if its own /companies fetch hit a network
      // hiccup (a real failure mode seen live: the Get button stayed
      // stuck disabled forever with no way to recover except a full page
      // reload). This can actually still succeed even when that happened.
      if (!activeCompanyId) {
        const selector = document.getElementById("company-selector");
        if (selector && selector.value) activeCompanyId = Number(selector.value);
      }
      if (!activeCompanyId) {
        voyagerAlert("Could not determine the active company. Check your connection and try Get again.");
        return;
      }
      const sPnr = document.getElementById("rs-search-spnr").value.trim();
      const airlinePnr = document.getElementById("rs-search-airline-pnr").value.trim();
      const ticketNo = document.getElementById("rs-search-ticket-no").value.trim();
      if (!sPnr && !airlinePnr && !ticketNo) {
        voyagerAlert("Enter S PNR, Airline PNR or Ticket No to search.");
        return;
      }
      try {
        const params = new URLSearchParams({ company_id: activeCompanyId, s_pnr: sPnr, airline_pnr: airlinePnr, ticket_no: ticketNo });
        const res = await fetch(`${window.API_BASE || "/api"}/tickets/lookup-for-reschedule/?${params}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Ticket not found.");
        lookupTicketId = data.ticket_id || null;
        lookupMatchedLineId = data.matched_line_id || null;
        // A Ticket No search identifies exactly ONE passenger, not the
        // whole booking - only show that one, not every passenger on
        // the same ticket (S PNR/Airline PNR searches have no single
        // matched passenger, so those still show everyone).
        lookupPassengers = lookupMatchedLineId
          ? (data.passengers || []).filter((p) => p.line_id === lookupMatchedLineId)
          : (data.passengers || []);
        renderPassengers();
        document.getElementById("rs-selection-row").style.display = "grid";
        document.getElementById("rs-reschedule-row").style.display = "flex";
      } catch (err) {
        voyagerAlert(err.message || "Could not search for this ticket. Is the Django backend running?", { icon: "error" });
      }
    }
    document.getElementById("rs-get-btn").addEventListener("click", lookupTicketForReschedule);

    function renderPassengers() {
      const tbody = document.getElementById("rs-pax-tbody");
      if (!lookupPassengers.length) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:1.5rem; color:var(--color-text-muted);">No passengers on this ticket.</td></tr>`;
        renderSectors();
        return;
      }
      // Pax checkboxes start unchecked - they're purely for marking who's
      // actually being rescheduled, not for controlling whether sectors
      // are shown (see renderSectors() below, which always shows every
      // passenger's sectors regardless of checkbox state).
      tbody.innerHTML = lookupPassengers.map((p, i) => `
        <tr>
          <td><input type="checkbox" class="rs-pax-check" data-idx="${i}" /></td>
          <td>${p.pax_type || "-"}</td>
          <td>${p.passenger_name || "-"}</td>
        </tr>
      `).join("");
      tbody.querySelectorAll(".rs-pax-check").forEach((cb) => cb.addEventListener("change", updateRescheduleButtonState));
      renderSectors();
    }

    // Shows every passenger's sectors right away, independent of the Pax
    // checkboxes - those only mark who's selected for the Reschedule
    // action, they don't gate what's visible here.
    function renderSectors() {
      const tbody = document.getElementById("rs-sector-tbody");
      const rows = [];
      lookupPassengers.forEach((p) => {
        (p.sectors || []).forEach((s) => {
          rows.push(`
            <tr>
              <td><input type="checkbox" class="rs-sector-check" /></td>
              <td>${s.sector || "-"}</td>
              <td>${s.flight_no || "-"}</td>
              <td>${s.travel_class || "-"}</td>
              <td>${s.travel_date || "-"}</td>
            </tr>
          `);
        });
      });
      tbody.innerHTML = rows.length
        ? rows.join("")
        : `<tr><td colspan="5" style="text-align:center; padding:1.5rem; color:var(--color-text-muted);">Select a passenger to see their sectors.</td></tr>`;
      tbody.querySelectorAll(".rs-sector-check").forEach((cb) => cb.addEventListener("change", updateRescheduleButtonState));
      updateRescheduleButtonState();
    }

    // Reschedule only makes sense once at least one passenger AND one of
    // their sectors is actually picked.
    function updateRescheduleButtonState() {
      const anyPax = document.querySelectorAll(".rs-pax-check:checked").length > 0;
      const anySector = document.querySelectorAll(".rs-sector-check:checked").length > 0;
      document.getElementById("rs-reschedule-btn").disabled = !(anyPax && anySector);
    }

    document.getElementById("rs-reschedule-btn").addEventListener("click", () => {
      const checkedPax = Array.from(document.querySelectorAll(".rs-pax-check:checked"))
        .map((cb) => lookupPassengers[Number(cb.dataset.idx)]);
      if (!lookupTicketId || !checkedPax.length) return;
      // Reschedule always produces one new ticket for one passenger - if
      // more than one pax got checked, the first one picked is who this
      // screen carries forward.
      const lineId = checkedPax[0].line_id;
      window.location.href = `ticket-entry.html?reschedule_ticket_id=${lookupTicketId}&reschedule_line_id=${lineId}`;
    });

    })();
  </script>
</body>
</html>
