<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Account Groups — TRAVEL AGENCY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="assets/css/design-system.css" rel="stylesheet" />
<link href="assets/css/app.css?v=8" rel="stylesheet" />
<style>
  /* Locked to the viewport - only the groups list scrolls (like the reports). */
  html, body { height:100%; overflow:hidden; margin:0; }
  .app-body { height:calc(100vh - var(--topnav-height) - var(--menubar-height, 0px)); overflow:hidden; }
  .grp-main { display:flex; flex-direction:column; height:100%; box-sizing:border-box; overflow:hidden; }
  .grp-main > * { flex-shrink:0; }
  .grp-card { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  #groups-body { flex:1 1 auto; min-height:0; overflow-y:auto; }
  /* Compact rows + report-style hover (blue row, white text). */
  .grp-row { display:flex; align-items:center; padding:0.22rem 0.85rem; min-height:30px; box-sizing:border-box; font-size:12.5px; border-bottom:1px solid var(--color-border-subtle); color:var(--color-text-body); gap:0.5rem; transition:background var(--t-fast); }
  .grp-row:last-child { border-bottom:none; }
  #groups-body .grp-row:hover { background:var(--color-primary); }
  #groups-body .grp-row:hover .grp-name { color:#FFFFFF !important; background:transparent !important; }
  .grp-row.header { background:var(--color-bg-subtle); color:#000000; font-weight:700; border-top:1px solid var(--color-border-subtle); }
  .grp-name { flex:1; color:var(--color-text-dark); }
  .grp-badge-wrap { width:90px; }
  .grp-actions { width:110px; text-align:right; display:flex; gap:0.3rem; justify-content:flex-end; }
  .grp-actions button { border:1px solid var(--color-border); background:var(--color-white); color:var(--color-text-body); border-radius:var(--radius-xs); padding:0.2rem 0.45rem; font-size:0.72rem; cursor:pointer; transition:all var(--t-fast); }
  .grp-actions button:hover { border-color:var(--color-primary); color:var(--color-primary); background:var(--color-bg-tint); }
  .grp-actions button:disabled { opacity:0.35; cursor:not-allowed; }
  .grp-actions button:disabled:hover { border-color:var(--color-border); color:inherit; background:var(--color-white); }
  #group-form-panel { display:none; }
</style>
</head><body>
<header class="app-topnav" id="shell-topnav"></header>
<div class="app-body">
  <aside class="app-sidebar" id="shell-sidebar"></aside>
  <main class="app-main grp-main">
    <div style="display:flex; align-items:center; justify-content:space-between;">
    <h1 style="font-size:1.15rem; margin:0;">Account Groups</h1>
    <div>
      <button class="btn-brand" id="new-group-btn" style="padding:0.5rem 1rem; font-size:0.85rem;">+ New Group</button>
    </div>
    </div>

    <form id="group-form-panel" class="card-glass card-pad" style="margin-top:1rem;">
      <div class="entry-section-title" id="form-title" style="margin-top:0;">New Group</div>
      <div id="form-error" class="pill pill-danger" style="display:none; margin-bottom:1rem;"></div>
      <div class="entry-grid">
        <div><label class="field-label">Group Name</label><input class="form-control-custom" id="group-name" required /></div>
        <div><label class="field-label">Parent Group</label><select class="form-control-custom" id="group-parent" required></select></div>
      </div>
      <div class="entry-actions">
        <button type="button" class="btn-outline-brand" id="cancel-form-btn">Cancel</button>
        <button type="submit" class="btn-brand" id="submit-form-btn">Save Group</button>
      </div>
    </form>

    <div class="card-glass grp-card" style="margin-top:0.7rem; overflow:hidden;">
      <div class="grp-row header">
        <div class="grp-name">Group Name</div>
        <div class="grp-actions">Actions</div>
      </div>
      <div id="groups-body"></div>
    </div>
  </main>
</div>
<script src="assets/js/hardcode.js?v=12"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/api.js?v=52"></script>
<script src="assets/js/util.js?v=52"></script>
<script src="assets/js/entry-common.js"></script>
<script src="assets/js/shell.js?v=52"></script>
<script src="assets/js/page-groups.js?v=3"></script>
</body></html>
