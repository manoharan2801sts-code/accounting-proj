<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Account Groups — TRAVEL AGENCY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="assets/css/design-system.css" rel="stylesheet" />
<link href="assets/css/app.css" rel="stylesheet" />
<style>
  .grp-row { display:flex; align-items:center; padding:0.42rem 0.85rem; font-size:0.82rem; border-bottom:1px solid var(--color-border-subtle); color:var(--color-text-body); gap:0.5rem; transition:background var(--t-fast); }
  .grp-row:last-child { border-bottom:none; }
  .grp-row:hover:not(.header) { background:var(--color-bg-subtle); }
  .grp-row.header { background:var(--color-bg-subtle); color:var(--color-text-dark); font-weight:700; border-top:1px solid var(--color-border-subtle); }
  .grp-code { width:85px; font-family:var(--font-mono); font-size:0.75rem; color:var(--color-text-muted); }
  .grp-name { flex:1; color:var(--color-text-dark); }
  .grp-badge-wrap { width:90px; }
  .grp-actions { width:110px; text-align:right; display:flex; gap:0.3rem; justify-content:flex-end; }
  .grp-actions button { border:1px solid var(--color-border); background:var(--color-white); color:var(--color-text-body); border-radius:var(--radius-xs); padding:0.2rem 0.45rem; font-size:0.72rem; cursor:pointer; transition:all var(--t-fast); }
  .grp-actions button:hover { border-color:var(--color-primary); color:var(--color-primary); background:var(--color-bg-tint); }
  .grp-actions button:disabled { opacity:0.35; cursor:not-allowed; }
  .grp-actions button:disabled:hover { border-color:var(--color-border); color:inherit; background:var(--color-white); }
  #group-form-panel { display:none; }
</style>
</head><body>
<header class="app-topnav" id="shell-topnav"></header>
<div class="app-body">
  <aside class="app-sidebar" id="shell-sidebar"></aside>
  <main class="app-main">
    <h1 style="font-size:1.15rem;">Account Groups</h1>
    <p class="text-muted-custom">The 23 standard groups (plus the 4 top-level natures) are system-protected and cannot be edited or deleted. Add your own groups underneath them as needed.</p>

    <div style="text-align:right; margin-top:0.8rem;">
      <button class="btn-brand" id="new-group-btn" style="padding:0.5rem 1rem; font-size:0.85rem;">+ New Group</button>
    </div>

    <form id="group-form-panel" class="card-glass card-pad" style="margin-top:1rem;">
      <div class="entry-section-title" id="form-title" style="margin-top:0;">New Group</div>
      <div id="form-error" class="pill pill-danger" style="display:none; margin-bottom:1rem;"></div>
      <div class="entry-grid">
        <div><label class="field-label">Group Name</label><input class="form-control-custom" id="group-name" required /></div>
        <div><label class="field-label">Parent Group</label><select class="form-control-custom" id="group-parent" required></select></div>
      </div>
      <div class="entry-actions">
        <button type="button" class="btn-outline-brand" id="cancel-form-btn">Cancel</button>
        <button type="submit" class="btn-brand" id="submit-form-btn">Save Group</button>
      </div>
    </form>

    <div class="card-glass" style="margin-top:0.7rem; overflow:hidden;">
      <div class="grp-row header">
        <div class="grp-code">Code</div><div class="grp-name">Group Name</div>
        <div class="grp-badge-wrap">Origin</div><div class="grp-actions">Actions</div>
      </div>
      <div id="groups-body"></div>
    </div>
  </main>
</div>
<script src="assets/js/hardcode.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/entry-common.js"></script>
<script src="assets/js/shell.js?v=6"></script>
<script src="assets/js/page-groups.js"></script>
</body></html>
