<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Balance Sheet — TRAVEL AGENCY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="assets/css/design-system.css" rel="stylesheet" />
  <link href="assets/css/app.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <style>
    /* Same look and behaviour as report-profit-loss.html: locked to the
       viewport, two-column Tally layout (Liabilities | Assets), Total pinned
       to the bottom of the grid, blue/white hover, click to zoom in. */
    html, body { height: 100%; overflow: hidden; margin: 0; }
    .bs-main {
      display: flex; flex-direction: column;
      height: calc(100vh - var(--topnav-height) - var(--menubar-height, 0px));
      box-sizing: border-box;
    }
    .filter-card { padding: 0.6rem 0; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; flex-shrink: 0; }
    .bs-toolbar-label { font-size: 11px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em; }
    .bs-toolbar-date { height: 26px; width: 116px; padding: 0 6px; font-size: 12px; box-sizing: border-box; }
    .bs-detailed-toggle { display: flex; align-items: center; gap: 0.35rem; font-size: 12px; font-weight: 600; color: var(--color-text-dark); cursor: pointer; }

    .bs-box {
      flex: 1; min-height: 0; background: var(--color-white); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); overflow: hidden;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr);
    }
    .bs-col { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .bs-col.bs-col-left { border-right: 2px solid var(--color-border); }
    .bs-col-body { flex: 1; min-height: 0; overflow-y: auto; }
    .bs-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .bs-table th {
      padding: 0.5rem 0.9rem; background: #F8FAFC; border-bottom: 1px solid var(--color-border);
      font-size: 12px; font-weight: 800; color: var(--color-text-dark); letter-spacing: 0.03em; text-align: left;
    }
    .bs-table th.bs-amt-head { text-align: right; }
    .bs-table td { padding: 0.4rem 0.9rem; font-size: 12.5px; color: var(--color-text); vertical-align: middle; }
    .bs-table td.bs-amt { font-family: var(--font-mono); text-align: right; white-space: nowrap; width: 9.5rem; }
    .bs-table col.bs-inner, .bs-table col.bs-outer { width: 9.5rem; }
    .bs-group-row td { font-weight: 700; color: var(--color-text-dark); }
    .bs-child-row td { padding-top: 0.25rem; padding-bottom: 0.25rem; }
    .bs-child-row td:first-child { padding-left: 2rem; font-style: italic; }
    .bs-child-row.bs-last td.bs-inner-amt { border-bottom: 1px solid var(--color-text-muted); }
    .bs-diff-row td { font-weight: 600; color: var(--color-text-dark); }
    .bs-total-row td { font-weight: 800; border-top: 1px solid var(--color-border); padding-top: 0.55rem; padding-bottom: 0.55rem; color: var(--color-text-dark); }
    .bs-empty-row td { padding: 1.25rem 0.9rem; text-align: center; color: var(--color-text-muted); font-size: 12px; }
    .bs-click { cursor: pointer; }
    /* Same hover as Trial Balance / Day Book / P&L rows: blue row, white text. */
    .bs-click:hover td { background: var(--color-primary); color: #FFFFFF; }

    /* Group zoom-in view (Trial-Balance-style Debit/Credit breakdown). */
    .bs-drill { display: none; flex: 1; min-height: 0; flex-direction: column; background: var(--color-white); border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
    .bs-drill-head { flex-shrink: 0; padding: 0.75rem 1rem; border-bottom: 1px solid var(--color-border); font-weight: 700; font-size: 0.92rem; color: var(--color-text-dark); }
    .bs-drill-scroll { flex: 1; min-height: 0; overflow-y: auto; }
    .bs-drill-scroll thead th { position: sticky; top: 0; z-index: 1; }
    .bs-drill .bs-table { table-layout: auto; }
    .bs-drill-total td { position: sticky; bottom: 0; font-weight: 800; border-top: 1px solid var(--color-border); background: #F8FAFC; }
    .bs-back-row { flex-shrink: 0; padding: 0.85rem 1rem; border-top: 1px solid var(--color-border); background: #FAFBFD; }
    .bs-back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 13px; font-weight: 600; color: var(--color-primary); text-decoration: none; cursor: pointer; }
    .bs-back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="app-topnav" id="shell-topnav"></header>
  <div class="app-body">
    <main class="app-main bs-main" style="max-width: 1440px; margin: 0 auto; padding: 1.5rem 2rem; width: 100%;">
      <div class="filter-card">
        <span class="bs-toolbar-label">As at</span>
        <input type="date" class="form-control-custom bs-toolbar-date" id="filter-to" />
        <button type="button" class="dom-nav-btn btn-primary" onclick="loadReport()">Apply</button>
        <label class="bs-detailed-toggle">
          <input type="checkbox" id="bs-detailed-view" onchange="rerender()" />
          Detailed View
        </label>
        <span style="margin-left:auto;"></span>
        <button type="button" class="dom-nav-btn" onclick="window.print()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2m-12 0v4h12v-4"/></svg>
          Print
        </button>
        <button type="button" class="dom-nav-btn btn-primary" onclick="exportCSV()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4m14-7l-5 5-5-5m5 5V3"/></svg>
          Export CSV
        </button>
      </div>

      <div class="bs-box" id="bs-box">
        <div class="bs-col bs-col-left">
          <table class="bs-table"><colgroup><col /><col class="bs-inner" /><col class="bs-outer" /></colgroup>
            <thead><tr><th>Liabilities</th><th></th><th class="bs-amt-head"></th></tr></thead>
          </table>
          <div class="bs-col-body">
            <table class="bs-table"><colgroup><col /><col class="bs-inner" /><col class="bs-outer" /></colgroup><tbody id="bs-left-body"></tbody></table>
          </div>
          <table class="bs-table"><colgroup><col /><col class="bs-inner" /><col class="bs-outer" /></colgroup><tbody id="bs-left-total"></tbody></table>
        </div>
        <div class="bs-col bs-col-right">
          <table class="bs-table"><colgroup><col /><col class="bs-inner" /><col class="bs-outer" /></colgroup>
            <thead><tr><th>Assets</th><th></th><th class="bs-amt-head"></th></tr></thead>
          </table>
          <div class="bs-col-body">
            <table class="bs-table"><colgroup><col /><col class="bs-inner" /><col class="bs-outer" /></colgroup><tbody id="bs-right-body"></tbody></table>
          </div>
          <table class="bs-table"><colgroup><col /><col class="bs-inner" /><col class="bs-outer" /></colgroup><tbody id="bs-right-total"></tbody></table>
        </div>
      </div>

      <!-- Zoom-in: one group's sub-groups/ledgers, closing balance as at the date. -->
      <div class="bs-drill" id="bs-drill">
        <div class="bs-drill-head" id="bs-drill-head"></div>
        <div class="bs-drill-scroll">
          <table class="bs-table">
            <thead><tr><th>Particulars</th><th class="bs-amt-head">Debit</th><th class="bs-amt-head">Credit</th></tr></thead>
            <tbody id="bs-drill-body"></tbody>
            <tfoot id="bs-drill-total"></tfoot>
          </table>
        </div>
        <div class="bs-back-row">
          <a href="#" class="bs-back-link" id="bs-back-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            <span id="bs-back-label">Back</span>
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api.js?v=3"></script>
  <script src="assets/js/hardcode.js"></script>
  <script src="assets/js/shell.js?v=21"></script>
  <script>
    // Not gated on DOMContentLoaded - this page's <script> can be injected
    // by the app's SPA navigation (shell.js's navigateTo) into a document
    // that already finished loading.
    (function () {
    let activeCompanyId = null;
    const urlParams = new URLSearchParams(window.location.search);
    let currentGroupId = urlParams.get("group_id") || null;
    let lastData = null;

    (async function init() {
      try {
        const active = await VoyagerShell.init({ activeKey: "rep-balance-sheet" });
        if (active) activeCompanyId = Number(active.id);
      } catch (err) {
        console.error("Shell init failed", err);
      }
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById("filter-to").value = urlParams.get("to") || today;
      loadReport();
    })();

    function ddmmyyyy(iso) {
      if (!iso) return "";
      const [y, m, d] = iso.split("-");
      return `${d}/${m}/${y}`;
    }
    const fmtPlain = (v) => Math.abs(Number(v) || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    // Tally shows a figure on the "wrong" side as (-)1,496.45.
    const fmtAmt = (v) => (!v ? "" : `${v < 0 ? "(-)" : ""}${fmtPlain(v)}`);
    const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    function syncUrl(push) {
      const url = new URL(window.location.href);
      url.searchParams.set("to", document.getElementById("filter-to").value);
      if (currentGroupId) url.searchParams.set("group_id", currentGroupId);
      else url.searchParams.delete("group_id");
      if (push) window.history.pushState({}, "", url);
      else window.history.replaceState({}, "", url);
    }

    function openLedger(ledgerId) {
      syncUrl(false);
      const from = encodeURIComponent("Balance Sheet");
      const fromUrl = encodeURIComponent(window.location.href);
      window.location.href = `report-ledger-monthly.html?ledger_id=${ledgerId}&from=${from}&from_url=${fromUrl}`;
    }
    function zoomInto(groupId) {
      currentGroupId = groupId ? String(groupId) : null;
      syncUrl(true);
      loadReport();
    }

    // One side: each item's own row (group total in the outer column), then
    // its children indented with their figures in the inner column.
    // Detailed View off: just each group's own total (Tally's condensed
    // view). On: each group's sub-groups/ledgers indented underneath too.
    function sideRows(items, detailed) {
      let html = "";
      items.forEach((r) => {
        const clickable = r.type === "group";
        const attrs = clickable ? `class="bs-group-row bs-click" data-group-id="${r.id}" title="Click to view this group's breakdown"`
          : `class="${r.type === "diff" ? "bs-diff-row" : "bs-group-row"}"`;
        html += `<tr ${attrs}><td>${esc(r.name)}</td><td></td><td class="bs-amt">${fmtAmt(r.amount)}</td></tr>`;
        (detailed ? (r.children || []) : []).forEach((c, i) => {
          const last = i === r.children.length - 1 ? " bs-last" : "";
          const cAttrs = c.type === "group" ? `data-group-id="${c.id}" title="Click to view this group's breakdown"`
            : c.type === "ledger" ? `data-ledger-id="${c.id}" title="Click to view this ledger's statement"` : "";
          const cls = `bs-child-row${last}${c.type === "group" || c.type === "ledger" ? " bs-click" : ""}`;
          html += `<tr class="${cls}" ${cAttrs}><td>${esc(c.name)}</td><td class="bs-amt bs-inner-amt">${fmtAmt(c.amount)}</td><td></td></tr>`;
        });
      });
      return html || `<tr class="bs-empty-row"><td colspan="3">Nothing to show.</td></tr>`;
    }

    function render(data) {
      lastData = data;
      document.getElementById("bs-box").style.display = "";
      document.getElementById("bs-drill").style.display = "none";
      const detailed = document.getElementById("bs-detailed-view").checked;
      document.getElementById("bs-left-body").innerHTML = sideRows(data.liabilities, detailed);
      document.getElementById("bs-right-body").innerHTML = sideRows(data.assets, detailed);
      const totalRow = `<tr class="bs-total-row"><td>Total</td><td></td><td class="bs-amt">${fmtPlain(data.total)}</td></tr>`;
      document.getElementById("bs-left-total").innerHTML = totalRow;
      document.getElementById("bs-right-total").innerHTML = totalRow;
    }

    function renderDrill(data) {
      lastData = data;
      document.getElementById("bs-box").style.display = "none";
      document.getElementById("bs-drill").style.display = "flex";
      document.getElementById("bs-drill-head").textContent = `${data.context.name}  (as at ${ddmmyyyy(document.getElementById("filter-to").value)})`;
      const cell = (v) => `<td class="bs-amt">${v ? fmtPlain(v) : ""}</td>`;
      document.getElementById("bs-drill-body").innerHTML = data.rows.length
        ? data.rows.map((r) => r.type === "group"
          ? `<tr class="bs-group-row bs-click" data-group-id="${r.id}" title="Click to view this group's breakdown"><td>${esc(r.name)}</td>${cell(r.debit)}${cell(r.credit)}</tr>`
          : `<tr class="bs-click" data-ledger-id="${r.id}" title="Click to view this ledger's statement" style="font-style:italic;"><td>${esc(r.name)}</td>${cell(r.debit)}${cell(r.credit)}</tr>`).join("")
        : `<tr class="bs-empty-row"><td colspan="3">Nothing posted under this group.</td></tr>`;
      document.getElementById("bs-drill-total").innerHTML =
        `<tr class="bs-drill-total"><td>Grand Total</td>${cell(data.total_debit)}${cell(data.total_credit)}</tr>`;
      // The shared group breakdown labels its top level "Trial Balance" -
      // here the top level is this Balance Sheet.
      const back = data.back && data.back.group_id ? data.back.label : "Balance Sheet";
      document.getElementById("bs-back-label").textContent = `Back to ${back}`;
    }

    document.getElementById("bs-box").addEventListener("click", rowClick);
    document.getElementById("bs-drill").addEventListener("click", rowClick);
    function rowClick(e) {
      const row = e.target.closest("tr.bs-click");
      if (!row) return;
      if (row.dataset.ledgerId) openLedger(row.dataset.ledgerId);
      else if (row.dataset.groupId) zoomInto(row.dataset.groupId);
    }
    document.getElementById("bs-back-link").addEventListener("click", (e) => {
      e.preventDefault();
      zoomInto(lastData && lastData.back ? lastData.back.group_id : null);
    });
    window.addEventListener("popstate", () => {
      if (!document.getElementById("bs-box")) return;
      currentGroupId = new URLSearchParams(window.location.search).get("group_id") || null;
      loadReport();
    });

    async function loadReport() {
      if (!activeCompanyId) return;
      const toDate = document.getElementById("filter-to").value;
      syncUrl(false);
      try {
        const params = new URLSearchParams({ company_id: activeCompanyId, to_date: toDate });
        if (currentGroupId) params.set("group_id", currentGroupId);
        const res = await fetch(`http://localhost:8000/api/balance-sheet/?${params}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Could not load the Balance Sheet.");
        if (currentGroupId) renderDrill(data);
        else render(data);
      } catch (err) {
        voyagerAlert(err.message || "Could not load the Balance Sheet. Is the Django backend running?", { icon: "error" });
      }
    }
    window.loadReport = loadReport;
    // Detailed View toggles without a network round-trip.
    function rerender() {
      if (lastData && !currentGroupId) render(lastData);
    }
    window.rerender = rerender;

    function exportCSV() {
      const csv = [];
      const push = (row) => {
        const cols = Array.from(row.querySelectorAll("th, td")).map((td) => `"${td.innerText.replace(/"/g, '""')}"`);
        if (cols.length) csv.push(cols.join(","));
      };
      if (currentGroupId) {
        document.querySelectorAll("#bs-drill tr").forEach(push);
      } else {
        document.querySelectorAll("#bs-box .bs-col").forEach((col, i) => {
          csv.push(i === 0 ? "Liabilities" : "Assets");
          col.querySelectorAll("table tr").forEach(push);
        });
      }
      const blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = currentGroupId ? "balance-sheet-group.csv" : "balance-sheet.csv";
      link.click();
    }
    window.exportCSV = exportCSV;
    })();
  </script>
</body>
</html>
