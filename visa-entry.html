<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>New Visa Application — TRAVEL AGENCY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="assets/css/design-system.css" rel="stylesheet" />
<link href="assets/css/app.css" rel="stylesheet" />
<link href="assets/css/loader.css" rel="stylesheet" />
</head><body>
<script src="assets/js/loader.js?v=2"></script>
<header class="app-topnav" id="shell-topnav"></header>
<div class="app-body">
  <aside class="app-sidebar" id="shell-sidebar"></aside>
  <main class="app-main" style="max-width:1400px;">
    <h1 style="font-size:1.15rem;" id="page-title">New Visa Application</h1>
    <p class="text-muted-custom">Supplier fee vs. customer fee — service charge margin shows live.</p>
    <form id="visa-form" style="margin-top:0.7rem;">
      <div class="entry-section-title">Application detail</div>
      <div class="entry-grid">
        <div><label class="field-label">Branch</label><select class="form-control-custom" id="branch" required></select></div>
        <div><label class="field-label">Customer</label><select class="form-control-custom" id="customer" required></select></div>
        <div><label class="field-label">Applicant Name</label><input class="form-control-custom" id="applicant_name" required /></div>
        <div><label class="field-label">Destination Country</label>
          <select class="form-control-custom" id="destination_country">
            <option>UAE</option><option>UK</option><option>Schengen</option><option>USA</option><option>India</option>
          </select>
        </div>
        <div><label class="field-label">Visa Type</label>
          <select class="form-control-custom" id="visa_type"><option>Tourist</option><option>Business</option><option>Transit</option></select>
        </div>
        <div><label class="field-label">Application Date</label><input class="form-control-custom" type="date" id="application_date" required /></div>
        <div><label class="field-label">Status</label>
          <select class="form-control-custom" id="status">
            <option value="SUBMITTED">Submitted</option><option value="APPROVED">Approved</option><option value="REJECTED">Rejected</option>
          </select>
        </div>
      </div>

      <div class="entry-section-title">Fees</div>
      <div class="entry-grid">
        <div><label class="field-label">Supplier Fee</label><input class="form-control-custom calc" type="number" id="supplier_fee" value="0" min="0" step="0.01" /></div>
        <div><label class="field-label">Customer Fee</label><input class="form-control-custom calc" type="number" id="customer_fee" value="0" min="0" step="0.01" /></div>
        <div><label class="field-label">Service Charge</label><div class="computed-field" id="service_charge">—</div></div>
      </div>

      <div class="entry-actions">
        <a href="visa.html" class="btn-outline-brand" id="cancel-link">Cancel</a>
        <button type="submit" class="btn-brand" id="submit-btn">Save Application</button>
      </div>
    </form>
  </main>
</div>
<script src="assets/js/hardcode.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/shell.js?v=6"></script>
<script src="assets/js/entry-common.js"></script>
<script src="assets/js/page-visa-entry.js"></script>
</body></html>
