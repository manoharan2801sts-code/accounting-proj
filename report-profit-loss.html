<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Profit and Loss Statement — TRAVEL AGENCY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="assets/css/design-system.css" rel="stylesheet" />
  <link href="assets/css/app.css" rel="stylesheet" />
<link href="assets/css/loader.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <style>
    /* Flat - no card background/border, sits directly on the page like
       the reference screenshot, not boxed in its own white card. */
    .filter-card {
      padding: 0.6rem 0; margin-bottom: 1.25rem;
      display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    }
    .pl-toolbar-label { font-size: 11px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em; }
    .pl-toolbar-date { height: 26px; width: 116px; padding: 0 6px; font-size: 12px; box-sizing: border-box; }

    /* Classic two-column Trading & Profit and Loss Account (Tally-style) -
       a single bordered box split by one vertical divider, Dr (Debit) on
       the left, Cr (Credit) on the right - NOT a modern vertical income
       statement. Each side is its own independent table (different row
       counts are normal and don't need to line up 1:1 across the
       divider), both using the exact same column widths/styling for
       visual symmetry. */
    .pl-box {
      background: var(--color-white); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); overflow: hidden;
      display: grid; grid-template-columns: 1fr 1fr;
    }
    .pl-col { min-width: 0; }
    .pl-col.pl-col-left { border-right: 2px solid var(--color-border); }
    .pl-table { width: 100%; border-collapse: collapse; }
    .pl-table th {
      padding: 0.5rem 0.9rem; background: #F8FAFC; border-bottom: 1px solid var(--color-border);
      font-size: 11px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em; text-align: left;
    }
    .pl-table th.pl-amt-head { text-align: right; }
    .pl-table td {
      padding: 0.4rem 0.9rem; font-size: 12.5px; color: var(--color-text); vertical-align: middle;
    }
    .pl-table td.pl-amt { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
    /* Orange group-header bar - "Purchase Accounts"/"Sales Accounts", the
       Trading Account's own two main lines, same look as the reference
       screenshot. */
    .pl-group-row td { background: #F5A623; color: #1E293B; font-weight: 700; }
    .pl-item-row td { padding-left: 1.6rem; color: var(--color-text-muted); }
    .pl-carry-row td { font-weight: 700; font-style: italic; }
    .pl-divider-row td { padding: 0; height: 2px; background: var(--color-text-dark); }
    .pl-total-row td {
      font-weight: 800; border-top: 2px solid var(--color-text-dark);
      padding-top: 0.55rem; padding-bottom: 0.55rem;
    }
    .pl-empty-row td { padding: 1.25rem 0.9rem; text-align: center; color: var(--color-text-muted); font-size: 12px; }
  </style>
</head>
<body>
<script src="assets/js/loader.js?v=2"></script>
  <header class="app-topnav" id="shell-topnav"></header>
  <div class="app-body">
    <main class="app-main" style="max-width: 1440px; margin: 0 auto; padding: 1.5rem 2rem;">
      <!-- Single compact toolbar row (From/To/Apply on the left, Print/
           Export CSV pushed to the far right via the margin-left:auto
           spacer) - same structure as report-dsr-airline-booking.html's
           own filter-card, minus Advanced Filter (not needed here). -->
      <div class="filter-card">
        <span class="pl-toolbar-label">From</span>
        <input type="date" class="form-control-custom pl-toolbar-date" id="filter-from" />
        <span class="pl-toolbar-label">To</span>
        <input type="date" class="form-control-custom pl-toolbar-date" id="filter-to" />
        <button type="button" class="dom-nav-btn btn-primary" onclick="loadReport()">Apply</button>
        <span style="margin-left:auto;"></span>
        <button type="button" class="dom-nav-btn" onclick="window.print()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2m-12 0v4h12v-4"/></svg>
          Print
        </button>
        <button type="button" class="dom-nav-btn btn-primary" onclick="exportCSV()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4m14-7l-5 5-5-5m5 5V3"/></svg>
          Export CSV
        </button>
      </div>

      <div class="pl-box" id="pl-box">
        <div class="pl-col pl-col-left">
          <table class="pl-table">
            <thead>
              <tr><th>Particulars</th><th class="pl-amt-head" id="pl-left-period">FY</th></tr>
            </thead>
            <tbody id="pl-left-body"></tbody>
          </table>
        </div>
        <div class="pl-col pl-col-right">
          <table class="pl-table">
            <thead>
              <tr><th>Particulars</th><th class="pl-amt-head" id="pl-right-period">FY</th></tr>
            </thead>
            <tbody id="pl-right-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/hardcode.js"></script>
  <script src="assets/js/shell.js?v=10"></script>
  <script>
    // Not gated on DOMContentLoaded - this page's <script> can be injected
    // by the app's SPA navigation (shell.js's navigateTo) into a document
    // that already finished loading, so DOMContentLoaded never fires again
    // and this would silently never run except on a hard refresh.
    (function () {
    let activeCompanyId = null;

    (async function init() {
      try {
        const active = await VoyagerShell.init({ activeKey: "rep-profit-loss" });
        if (active) activeCompanyId = Number(active.id);
      } catch (err) {
        console.error("Shell init failed", err);
      }
      // Defaults to today only, not a wide static range - same reasoning
      // as every other report page here (this project posts a lot of
      // data per day).
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById("filter-from").value = document.getElementById("filter-from").value || today;
      document.getElementById("filter-to").value = document.getElementById("filter-to").value || today;
      loadReport();
    })();

    function fmtN(v) {
      return (Number(v) || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function ddmmyyyy(iso) {
      if (!iso) return "";
      const [y, m, d] = iso.split("-");
      return `${d}/${m}/${y}`;
    }

    // Builds one side's <tbody> rows - group (orange header) + its own
    // itemised ledgers, for however many groups this side has (Trading
    // section groups first, then - after the divider - the P&L section's
    // one group), plus whichever "carry" lines apply (Gross Profit/Loss
    // c/o or b/f, Net Profit/Loss) and the final Total row.
    function sectionRows(groups) {
      let html = "";
      groups.forEach((g) => {
        if (!g.items.length) return;
        html += `<tr class="pl-group-row"><td colspan="2">${g.name}</td></tr>`;
        g.items.forEach((it) => {
          html += `<tr class="pl-item-row"><td>${it.name}</td><td class="pl-amt">${fmtN(it.amount)}</td></tr>`;
        });
      });
      return html;
    }
    function carryRow(label, amount) {
      return `<tr class="pl-carry-row"><td>${label}</td><td class="pl-amt">${amount != null ? fmtN(amount) : ""}</td></tr>`;
    }
    function totalRow(amount) {
      return `<tr class="pl-total-row"><td>Total</td><td class="pl-amt">${fmtN(amount)}</td></tr>`;
    }

    function render(data) {
      const period = `FY ${ddmmyyyy(data.from_date)} - ${ddmmyyyy(data.to_date)}`;
      document.getElementById("pl-left-period").textContent = period;
      document.getElementById("pl-right-period").textContent = period;

      const t = data.trading, p = data.pl;
      const grossProfit = t.gross_profit;   // > 0 profit, < 0 loss
      const netProfit = p.net_profit;       // > 0 profit, < 0 loss

      // LEFT (Debit) side: Purchase Accounts + Direct Expenses, Gross
      // Profit c/o if the Trading Account made a profit (balances this
      // side up to match Credit), divider, Indirect Expenses, Gross Loss
      // b/f if it made a loss instead, Net Profit if the P&L Account made
      // one (balances this side up to match Credit).
      let left = sectionRows([t.debit.purchase, t.debit.direct_expense]);
      if (grossProfit > 0) left += carryRow("Gross Profit c/o", grossProfit);
      left += `<tr class="pl-divider-row"><td colspan="2"></td></tr>`;
      left += sectionRows([p.debit.indirect_expense]);
      if (grossProfit < 0) left += carryRow("Gross Loss b/f", -grossProfit);
      if (netProfit > 0) left += carryRow("Net Profit", netProfit);
      // The P&L Account's own balanced total already equals indirect
      // items + whichever carry-forward/Net Profit figure was just added
      // above (see profit_loss_report's own total_debit = max(pl_dr,
      // pl_cr)) - the one Total shown at the bottom of the whole combined
      // account, same as the reference screenshot (no separate sub-total
      // for the Trading Account section above the divider).
      left += totalRow(p.total_debit);

      // RIGHT (Credit) side: Sales Accounts + Direct Income, Gross Loss
      // c/o if the Trading Account made a loss, divider, Indirect Income,
      // Gross Profit b/f if it made a profit instead, Net Loss if the
      // P&L Account made one.
      let right = sectionRows([t.credit.sales, t.credit.direct_income]);
      if (grossProfit < 0) right += carryRow("Gross Loss c/o", -grossProfit);
      right += `<tr class="pl-divider-row"><td colspan="2"></td></tr>`;
      right += sectionRows([p.credit.indirect_income]);
      if (grossProfit > 0) right += carryRow("Gross Profit b/f", grossProfit);
      if (netProfit < 0) right += carryRow("Net Loss", -netProfit);
      right += totalRow(p.total_credit);

      const noActivity = !t.debit.purchase.items.length && !t.debit.direct_expense.items.length
        && !t.credit.sales.items.length && !t.credit.direct_income.items.length
        && !p.debit.indirect_expense.items.length && !p.credit.indirect_income.items.length;
      document.getElementById("pl-left-body").innerHTML = noActivity
        ? `<tr class="pl-empty-row"><td colspan="2">No activity in this period.</td></tr>` : left;
      document.getElementById("pl-right-body").innerHTML = noActivity
        ? `<tr class="pl-empty-row"><td colspan="2">No activity in this period.</td></tr>` : right;
    }

    async function loadReport() {
      if (!activeCompanyId) return;
      const fromDate = document.getElementById("filter-from").value;
      const toDate = document.getElementById("filter-to").value;
      try {
        const params = new URLSearchParams({ company_id: activeCompanyId, from_date: fromDate, to_date: toDate });
        const res = await fetch(`${API_BASE}/profit-loss/?${params}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Could not load the Profit and Loss Account.");
        render(data);
      } catch (err) {
        voyagerAlert(err.message || "Could not load the Profit and Loss Account. Is the Django backend running?", { icon: "error" });
      }
    }
    window.loadReport = loadReport;

    function exportCSV() {
      let csv = [];
      document.querySelectorAll("#pl-box table").forEach((table, i) => {
        csv.push(i === 0 ? "Debit (Dr)" : "Credit (Cr)");
        table.querySelectorAll("tr").forEach((row) => {
          const cols = Array.from(row.querySelectorAll("th, td")).map((td) => `"${td.innerText.replace(/"/g, '""')}"`);
          if (cols.length) csv.push(cols.join(","));
        });
      });
      const blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "profit-and-loss.csv";
      link.click();
    }
    window.exportCSV = exportCSV;

    })();
  </script>
</body>
</html>
