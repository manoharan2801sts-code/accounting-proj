<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Profit and Loss Statement — TRAVEL AGENCY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="assets/css/design-system.css" rel="stylesheet" />
  <link href="assets/css/app.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <style>
    /* Hides the page's own vertical scrollbar track - still scrollable
       with the mouse wheel/keyboard if content ever runs taller than the
       viewport (Detailed View can get long), just no visible scrollbar
       chrome down the right edge. */
    html { scrollbar-width: none; }
    html::-webkit-scrollbar { display: none; }

    /* Locked to the viewport - the page itself never scrolls (same pattern
       as report-day-book.html). The account box fills the remaining height,
       each side's Total sits at the very bottom of the grid, and only the
       rows between scroll if they ever run taller than the screen. */
    html, body { height: 100%; overflow: hidden; margin: 0; }
    .pl-main {
      display: flex; flex-direction: column;
      height: calc(100vh - var(--topnav-height) - var(--menubar-height, 0px));
      box-sizing: border-box;
    }
    .pl-main .filter-card { flex-shrink: 0; }
    .pl-main .pl-box { flex: 1; min-height: 0; grid-template-rows: minmax(0, 1fr); }
    .pl-main .pl-col { min-height: 0; }
    .pl-main .pl-col-body { min-height: 0; overflow-y: auto; }

    /* Flat - no card background/border, sits directly on the page like
       the reference screenshot, not boxed in its own white card. */
    .filter-card {
      padding: 0.6rem 0; margin-bottom: 1.25rem;
      display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    }
    .pl-toolbar-label { font-size: 11px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em; }
    .pl-toolbar-date { height: 26px; width: 116px; padding: 0 6px; font-size: 12px; box-sizing: border-box; }

    /* Classic two-column Trading & Profit and Loss Account (Tally-style) -
       a single bordered box split by one vertical divider, Dr (Debit) on
       the left, Cr (Credit) on the right - NOT a modern vertical income
       statement. Each side is its own independent table (different row
       counts are normal and don't need to line up 1:1 across the
       divider). Grid's own default stretch makes both columns the same
       height (the taller side's natural height); each column is then a
       flex column itself so its OWN Total row sits flush at the bottom
       of that shared height instead of wherever its own content happens
       to end - the body area (.pl-col-body) just grows via flex:1, never
       scrolls (no max-height/overflow here on purpose - no scrollbar). */
    .pl-box {
      background: var(--color-white); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); overflow: hidden;
      display: grid; grid-template-columns: 1fr 1fr;
    }
    .pl-col { min-width: 0; display: flex; flex-direction: column; }
    .pl-col.pl-col-left { border-right: 2px solid var(--color-border); }
    .pl-col-body { flex: 1; }
    .pl-table { width: 100%; border-collapse: collapse; }
    .pl-table th {
      padding: 0.5rem 0.9rem; background: #F8FAFC; border-bottom: 1px solid var(--color-border);
      font-size: 12px; font-weight: 800; color: var(--color-text-dark); letter-spacing: 0.03em; text-align: left;
    }
    .pl-table th.pl-amt-head { text-align: right; }
    .pl-table td {
      padding: 0.4rem 0.9rem; font-size: 12.5px; color: var(--color-text); vertical-align: middle;
    }
    .pl-table td.pl-amt { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
    /* Group header - "Purchase Accounts"/"Sales Accounts"/"Indirect
       Expenses"/"Indirect Income" - plain bold, no highlight color. In
       collapsed (non-detailed) view this row also carries the group's
       own rolled-up total; in Detailed View it's just a label, with its
       itemised ledgers (.pl-item-row) below it instead. */
    .pl-group-row td { font-weight: 700; }
    .pl-item-row td { padding-left: 1.6rem; color: var(--color-text-muted); }
    .pl-carry-row td { font-weight: 700; font-style: italic; }
    .pl-divider-row td { padding: 0; height: 1px; border-bottom: 1px solid var(--color-border); }
    .pl-total-row td {
      font-weight: 800; border-top: 1px solid var(--color-border);
      padding-top: 0.55rem; padding-bottom: 0.55rem;
    }
    .pl-empty-row td { padding: 1.25rem 0.9rem; text-align: center; color: var(--color-text-muted); font-size: 12px; }
    .pl-detailed-toggle { display: flex; align-items: center; gap: 0.35rem; font-size: 12px; font-weight: 600; color: var(--color-text-dark); cursor: pointer; }

    /* Zoom-in: group and ledger rows are clickable (same as Trial Balance). */
    .pl-click { cursor: pointer; }
    /* Same hover as Trial Balance / Day Book rows: blue row, white text. */
    .pl-click:hover td { background: var(--color-primary); color: #FFFFFF; }
    /* Trading section subtotal (Tally's ruled figure under Gross Profit c/o) -
       the same figure on both sides, so the two sections line up. */
    .pl-subtotal-row td { padding-top: 0.3rem; padding-bottom: 0.5rem; }
    .pl-subtotal-row td.pl-amt span {
      display: inline-block; min-width: 9rem; padding: 0.2rem 0; font-weight: 700;
      border-top: 1px solid var(--color-text-muted); border-bottom: 1px solid var(--color-text-muted);
    }
    .pl-spacer-row td { height: 1.75rem; }

    /* Group zoom-in view (Trial-Balance-style Debit/Credit breakdown). */
    .pl-drill { display: none; flex: 1; min-height: 0; flex-direction: column; background: var(--color-white); border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
    .pl-drill-head { flex-shrink: 0; padding: 0.75rem 1rem; border-bottom: 1px solid var(--color-border); font-weight: 700; font-size: 0.92rem; color: var(--color-text-dark); }
    .pl-drill-scroll { flex: 1; min-height: 0; overflow-y: auto; }
    .pl-drill-scroll thead th { position: sticky; top: 0; z-index: 1; }
    .pl-drill-total td { position: sticky; bottom: 0; }
    .pl-drill .pl-table td.pl-amt, .pl-drill .pl-table th.pl-amt-head { width: 160px; }
    .pl-drill-total td { font-weight: 800; border-top: 1px solid var(--color-border); background: #F8FAFC; }
    .pl-back-row { flex-shrink: 0; padding: 0.85rem 1rem; border-top: 1px solid var(--color-border); background: #FAFBFD; }
    .pl-back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 13px; font-weight: 600; color: var(--color-primary); text-decoration: none; cursor: pointer; }
    .pl-back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="app-topnav" id="shell-topnav"></header>
  <div class="app-body">
    <main class="app-main pl-main" style="max-width: 1440px; margin: 0 auto; padding: 1.5rem 2rem; width: 100%;">
      <!-- Single compact toolbar row (From/To/Apply on the left, Print/
           Export CSV pushed to the far right via the margin-left:auto
           spacer) - same structure as report-dsr-airline-booking.html's
           own filter-card, minus Advanced Filter (not needed here). -->
      <div class="filter-card">
        <span class="pl-toolbar-label">From</span>
        <input type="date" class="form-control-custom pl-toolbar-date" id="filter-from" />
        <span class="pl-toolbar-label">To</span>
        <input type="date" class="form-control-custom pl-toolbar-date" id="filter-to" />
        <button type="button" class="dom-nav-btn btn-primary" onclick="loadReport()">Apply</button>
        <label class="pl-detailed-toggle">
          <input type="checkbox" id="pl-detailed-view" onchange="rerender()" />
          Detailed View
        </label>
        <span style="margin-left:auto;"></span>
        <button type="button" class="dom-nav-btn" onclick="window.print()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2m-12 0v4h12v-4"/></svg>
          Print
        </button>
        <button type="button" class="dom-nav-btn btn-primary" onclick="exportCSV()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4m14-7l-5 5-5-5m5 5V3"/></svg>
          Export CSV
        </button>
      </div>

      <div class="pl-box" id="pl-box">
        <div class="pl-col pl-col-left">
          <table class="pl-table">
            <thead>
              <tr><th>Particulars</th><th class="pl-amt-head"></th></tr>
            </thead>
          </table>
          <div class="pl-col-body">
            <table class="pl-table"><tbody id="pl-left-body"></tbody></table>
          </div>
          <table class="pl-table"><tbody id="pl-left-total"></tbody></table>
        </div>
        <div class="pl-col pl-col-right">
          <table class="pl-table">
            <thead>
              <tr><th>Particulars</th><th class="pl-amt-head"></th></tr>
            </thead>
          </table>
          <div class="pl-col-body">
            <table class="pl-table"><tbody id="pl-right-body"></tbody></table>
          </div>
          <table class="pl-table"><tbody id="pl-right-total"></tbody></table>
        </div>
      </div>

      <!-- Zoom-in: one group's sub-groups/ledgers for the same period. -->
      <div class="pl-drill" id="pl-drill">
        <div class="pl-drill-head" id="pl-drill-head"></div>
        <div class="pl-drill-scroll">
          <table class="pl-table">
            <thead><tr><th>Particulars</th><th class="pl-amt-head">Debit</th><th class="pl-amt-head">Credit</th></tr></thead>
            <tbody id="pl-drill-body"></tbody>
            <tfoot id="pl-drill-total"></tfoot>
          </table>
        </div>
        <div class="pl-back-row">
          <a href="#" class="pl-back-link" id="pl-back-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            <span id="pl-back-label">Back</span>
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api.js?v=3"></script>
  <script src="assets/js/hardcode.js"></script>
  <script src="assets/js/shell.js?v=21"></script>
  <script>
    // Not gated on DOMContentLoaded - this page's <script> can be injected
    // by the app's SPA navigation (shell.js's navigateTo) into a document
    // that already finished loading, so DOMContentLoaded never fires again
    // and this would silently never run except on a hard refresh.
    (function () {
    let activeCompanyId = null;
    // Group being zoomed into (?group_id=) - null = the main account.
    const urlParams = new URLSearchParams(window.location.search);
    let currentGroupId = urlParams.get("group_id") || null;

    (async function init() {
      try {
        const active = await VoyagerShell.init({ activeKey: "rep-profit-loss" });
        if (active) activeCompanyId = Number(active.id);
      } catch (err) {
        console.error("Shell init failed", err);
      }
      // Defaults to today only, not a wide static range - same reasoning
      // as every other report page here (this project posts a lot of
      // data per day). From/To come back from the URL when returning from
      // a drilled-into ledger.
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById("filter-from").value = urlParams.get("from") || document.getElementById("filter-from").value || today;
      document.getElementById("filter-to").value = urlParams.get("to") || document.getElementById("filter-to").value || today;
      loadReport();
    })();

    // From/To/group in the address bar, so Back from a ledger (document.
    // referrer / from_url) lands on this exact view again.
    function syncUrl(push) {
      const url = new URL(window.location.href);
      url.searchParams.set("from", document.getElementById("filter-from").value);
      url.searchParams.set("to", document.getElementById("filter-to").value);
      if (currentGroupId) url.searchParams.set("group_id", currentGroupId);
      else url.searchParams.delete("group_id");
      if (push) window.history.pushState({}, "", url);
      else window.history.replaceState({}, "", url);
    }

    function openLedger(ledgerId) {
      syncUrl(false);
      const from = encodeURIComponent("Profit and Loss");
      const fromUrl = encodeURIComponent(window.location.href);
      window.location.href = `report-ledger-monthly.html?ledger_id=${ledgerId}&from=${from}&from_url=${fromUrl}`;
    }

    function zoomInto(groupId) {
      currentGroupId = groupId ? String(groupId) : null;
      syncUrl(true);
      loadReport();
    }

    function fmtN(v) {
      return (Number(v) || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function ddmmyyyy(iso) {
      if (!iso) return "";
      const [y, m, d] = iso.split("-");
      return `${d}/${m}/${y}`;
    }

    // Tally-style Trading & Profit and Loss Account. Every one of the six
    // groups is always listed (blank amount when nothing was posted), each
    // clickable to zoom into it; Detailed View also lists its ledgers
    // (each clickable to its own statement).
    const amtCell = (v) => `<td class="pl-amt">${v ? fmtN(v) : ""}</td>`;
    function groupRows(g, detailed) {
      let html = `<tr class="pl-group-row pl-click" data-group-id="${g.id || ""}" title="Click to view this group's breakdown"><td>${g.name}</td>${detailed ? "<td></td>" : amtCell(g.total)}</tr>`;
      if (detailed) {
        g.items.forEach((it) => {
          html += `<tr class="pl-item-row pl-click" data-ledger-id="${it.ledger_id}" title="Click to view this ledger's statement"><td>${it.name}</td>${amtCell(it.amount)}</tr>`;
        });
        if (g.items.length) html += `<tr class="pl-group-row"><td></td>${amtCell(g.total)}</tr>`;
      }
      return html;
    }
    const carryRow = (label, amount) => `<tr class="pl-carry-row"><td>${label}</td>${amtCell(amount)}</tr>`;
    // Same class/height as a carry row, so both sides' subtotals line up.
    const spacerRow = () => `<tr class="pl-carry-row"><td>&nbsp;</td><td class="pl-amt"></td></tr>`;
    const subtotalRow = (amount) => `<tr class="pl-subtotal-row"><td></td><td class="pl-amt"><span>${fmtN(amount)}</span></td></tr>`;
    const totalRow = (amount) => `<tr class="pl-total-row"><td>Total</td><td class="pl-amt">${fmtN(amount)}</td></tr>`;

    let lastData = null;
    function render(data) {
      lastData = data;
      document.getElementById("pl-box").style.display = "";
      document.getElementById("pl-drill").style.display = "none";
      const detailed = document.getElementById("pl-detailed-view").checked;

      const t = data.trading, p = data.pl;
      const grossProfit = t.gross_profit;   // > 0 profit, < 0 loss
      const netProfit = p.net_profit;       // > 0 profit, < 0 loss

      // Trading section - same row count on both sides (the carry line or a
      // blank spacer), so the two ruled subtotals line up across the divider.
      // LEFT (Dr): Purchase Accounts, Direct Expenses, Gross Profit c/o.
      // RIGHT (Cr): Sales Accounts, Direct Income(s), Gross Loss c/o.
      let left = groupRows(t.debit.purchase, detailed) + groupRows(t.debit.direct_expense, detailed);
      left += grossProfit > 0 ? carryRow("Gross Profit c/o", grossProfit) : spacerRow();
      let right = groupRows(t.credit.sales, detailed) + groupRows(t.credit.direct_income, detailed);
      right += grossProfit < 0 ? carryRow("Gross Loss c/o", -grossProfit) : spacerRow();
      // Detailed View can list more ledgers on one side - pad the shorter
      // side with blank rows so the two subtotals stay level.
      const rowCount = (html) => (html.match(/<tr/g) || []).length;
      while (rowCount(left) < rowCount(right)) left += spacerRow();
      while (rowCount(right) < rowCount(left)) right += spacerRow();
      left += subtotalRow(t.total_debit);
      right += subtotalRow(t.total_credit);

      // Profit & Loss section.
      // LEFT (Dr): Gross Loss b/f, Indirect Expenses, Nett Profit.
      // RIGHT (Cr): Gross Profit b/f, Indirect Income(s), Nett Loss.
      if (grossProfit < 0) left += carryRow("Gross Loss b/f", -grossProfit);
      left += groupRows(p.debit.indirect_expense, detailed);
      if (netProfit > 0) left += carryRow("Nett Profit", netProfit);
      if (grossProfit > 0) right += carryRow("Gross Profit b/f", grossProfit);
      right += groupRows(p.credit.indirect_income, detailed);
      if (netProfit < 0) right += carryRow("Nett Loss", -netProfit);

      document.getElementById("pl-left-body").innerHTML = left;
      document.getElementById("pl-right-body").innerHTML = right;
      document.getElementById("pl-left-total").innerHTML = totalRow(p.total_debit);
      document.getElementById("pl-right-total").innerHTML = totalRow(p.total_credit);
    }

    // Zoom-in view: one group's sub-groups (click to go deeper) and ledgers
    // (click for the ledger's statement), Debit/Credit for the period.
    function renderDrill(data) {
      lastData = data;
      document.getElementById("pl-box").style.display = "none";
      document.getElementById("pl-drill").style.display = "flex";
      document.getElementById("pl-drill-head").textContent =
        `${data.context.name}  (${ddmmyyyy(data.from_date)} to ${ddmmyyyy(data.to_date)})`;
      const cell = (v) => `<td class="pl-amt">${v ? fmtN(v) : ""}</td>`;
      document.getElementById("pl-drill-body").innerHTML = data.rows.length
        ? data.rows.map((r) => r.type === "group"
          ? `<tr class="pl-group-row pl-click" data-group-id="${r.id}" title="Click to view this group's breakdown"><td>${r.name}</td>${cell(r.debit)}${cell(r.credit)}</tr>`
          : `<tr class="pl-item-row pl-click" data-ledger-id="${r.id}" title="Click to view this ledger's statement" style="font-style:italic;"><td>${r.name}</td>${cell(r.debit)}${cell(r.credit)}</tr>`).join("")
        : `<tr class="pl-empty-row"><td colspan="3">Nothing posted under this group in this period.</td></tr>`;
      document.getElementById("pl-drill-total").innerHTML =
        `<tr class="pl-drill-total"><td>Grand Total</td>${cell(data.total_debit)}${cell(data.total_credit)}</tr>`;
      document.getElementById("pl-back-label").textContent = `Back to ${data.back ? data.back.label : "Profit and Loss"}`;
    }

    // One click handler for both views (rows are re-rendered every load).
    document.getElementById("pl-box").addEventListener("click", rowClick);
    document.getElementById("pl-drill").addEventListener("click", rowClick);
    function rowClick(e) {
      const row = e.target.closest("tr.pl-click");
      if (!row) return;
      if (row.dataset.ledgerId) openLedger(row.dataset.ledgerId);
      else if (row.dataset.groupId) zoomInto(row.dataset.groupId);
    }
    document.getElementById("pl-back-link").addEventListener("click", (e) => {
      e.preventDefault();
      zoomInto(lastData && lastData.back ? lastData.back.group_id : null);
    });
    // Browser Back/Forward between zoom levels.
    window.addEventListener("popstate", () => {
      if (!document.getElementById("pl-box")) return;
      currentGroupId = new URLSearchParams(window.location.search).get("group_id") || null;
      loadReport();
    });

    // Detailed View toggles without a network round-trip - the last
    // response already has everything needed to re-render either way.
    function rerender() {
      if (lastData && !currentGroupId) render(lastData);
    }
    window.rerender = rerender;

    async function loadReport() {
      if (!activeCompanyId) return;
      const fromDate = document.getElementById("filter-from").value;
      const toDate = document.getElementById("filter-to").value;
      syncUrl(false);
      try {
        const params = new URLSearchParams({ company_id: activeCompanyId, from_date: fromDate, to_date: toDate });
        if (currentGroupId) params.set("group_id", currentGroupId);
        const res = await fetch(`http://localhost:8000/api/profit-loss/?${params}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Could not load the Profit and Loss Account.");
        if (currentGroupId) renderDrill(data);
        else render(data);
      } catch (err) {
        voyagerAlert(err.message || "Could not load the Profit and Loss Account. Is the Django backend running?", { icon: "error" });
      }
    }
    window.loadReport = loadReport;

    function exportCSV() {
      let csv = [];
      if (currentGroupId) {
        document.querySelectorAll("#pl-drill tr").forEach((row) => {
          const cols = Array.from(row.querySelectorAll("th, td")).map((td) => `"${td.innerText.replace(/"/g, '""')}"`);
          if (cols.length) csv.push(cols.join(","));
        });
        const blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "profit-and-loss-group.csv";
        link.click();
        return;
      }
      // Each side is now 3 separate <table>s (header/body/total footer -
      // see pl-col-body in the markup, which keeps the Total pinned to
      // the bottom) - grouped by .pl-col here, not by raw table index.
      document.querySelectorAll("#pl-box .pl-col").forEach((col, i) => {
        csv.push(i === 0 ? "Debit (Dr)" : "Credit (Cr)");
        col.querySelectorAll("table tr").forEach((row) => {
          const cols = Array.from(row.querySelectorAll("th, td")).map((td) => `"${td.innerText.replace(/"/g, '""')}"`);
          if (cols.length) csv.push(cols.join(","));
        });
      });
      const blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "profit-and-loss.csv";
      link.click();
    }
    window.exportCSV = exportCSV;

    })();
  </script>
</body>
</html>
