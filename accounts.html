<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Ledger Master — TRAVEL AGENCY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="assets/css/design-system.css" rel="stylesheet" />
<link href="assets/css/app.css?v=8" rel="stylesheet" />
<style>
  /* Only the grid itself scrolls - the page/heading/search bar stay put. */
  html, body { height: 100%; overflow: hidden; margin: 0; }
  .app-main.coa-main {
    display: flex;
    flex-direction: column;
    height: calc(100vh - var(--topnav-height) - var(--menubar-height, 0px));
  }
  .coa-main > h1, .coa-main > .coa-toolbar-row { flex-shrink: 0; }
  .coa-main > .card-glass {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  /* Compact rows, same density as the report grids (about 26px). */
  .coa-row { display:flex; align-items:center; min-height:26px; padding:0.18rem 0.85rem; font-size:12.5px; line-height:1.35; border-bottom:1px solid var(--color-border-subtle); color:var(--color-text-body); transition:background var(--t-fast); }
  .coa-row:last-child { border-bottom:none; }
  .coa-tree-toggle { display:flex; align-items:center; gap:0.45rem; font-size:13px; color:var(--color-text-dark); cursor:pointer; user-select:none; white-space:nowrap; }
  .coa-tree-toggle input { width:15px; height:15px; margin:0; cursor:pointer; }
  /* Alternating row bands + solid-blue hover, same look as the report
     grids (report-dsr-airline-booking.html etc.) - group rows keep their
     own distinct background regardless of the stripe. */
  .coa-row:not(.group):nth-child(even) { background: #F8FAFC; }
  .coa-row:hover:not(.group) { background:var(--color-primary); color:#FFFFFF; }
  .coa-row:hover:not(.group) .coa-name,
  .coa-row:hover:not(.group) .coa-name a,
  .coa-row:hover:not(.group) .coa-balance { color:#FFFFFF; }
  .coa-row:hover:not(.group) .coa-name a:hover { color:#FFFFFF; }
  .coa-row.group { background:var(--color-bg-subtle); color:var(--color-text-dark); font-weight:700; border-top:1px solid var(--color-border-subtle); }
  #coa-header-row { position: sticky; top: 0; z-index: 2; border-top: none; }
  .coa-name { flex:1; color:var(--color-text-dark); }
  .coa-type { width:100px; }
  .coa-balance { width:140px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; color:var(--color-text-dark); }
  .coa-name a { color:var(--color-text-dark); text-decoration:none !important; }
  .coa-name a:hover { color:var(--color-primary); text-decoration:none !important; }
  .coa-actions { width:100px; text-align:right; display:flex; gap:0.3rem; justify-content:flex-end; }
  .coa-actions a, .coa-actions button { border:1px solid var(--color-border); background:var(--color-white); color:var(--color-text-body); border-radius:var(--radius-xs); padding:0.05rem 0.4rem; font-size:0.7rem; line-height:1.4; cursor:pointer; text-decoration:none !important; transition:all var(--t-fast); }
  .coa-actions a:hover, .coa-actions button:hover { border-color:var(--color-primary); color:var(--color-primary); background:var(--color-bg-tint); }
  /* Tight spacing like the report pages - small top padding, no extra
     margin under the title. */
  .app-main.coa-main { padding-top: 12px; }
  .coa-main > h1 { margin: 0; }
  .coa-main > .coa-toolbar-row { margin-top: 0.45rem !important; }
  .coa-main > .card-glass { margin-top: 0.5rem !important; }
  /* Compact toolbar - same size as the report pages' controls (26px). */
  .coa-toolbar-row .global-search { max-width: 300px; }
  .coa-toolbar-row .global-search input { height: 26px; padding: 0 0.6rem 0 1.85rem; font-size: 12px; border-radius: 2px; }
  .coa-toolbar-row .global-search .icon { left: 0.55rem; }
  .coa-toolbar-row .dom-nav-btn { text-decoration: none; display: inline-flex; align-items: center; }
</style>
</head><body>
<header class="app-topnav" id="shell-topnav"></header>
<div class="app-body">
  <aside class="app-sidebar" id="shell-sidebar"></aside>
  <main class="app-main coa-main">
    <h1 style="font-size:0.92rem;">Ledger Master</h1>
    <div class="coa-toolbar-row" style="display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-top:0.6rem; flex-wrap:wrap;">
      <div class="global-search" style="flex:1;">
        <span class="icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
        <input type="text" id="coa-search" placeholder="Search by ledger name, code, or group…" />
      </div>
      <!-- Unchecked (default): every ledger in one A-Z list, no group rows.
           Checked: the full group tree. -->
      <label class="coa-tree-toggle"><input type="checkbox" id="coa-tree-view" /> Show Tree View</label>
      <a href="ledger-entry.html" class="dom-nav-btn btn-primary">+ New Ledger</a>
    </div>
    <div class="card-glass" style="margin-top:0.7rem;">
      <div class="coa-row group" id="coa-header-row"><div class="coa-name">Account</div><div class="coa-type">Type</div><div class="coa-balance">Balance</div><div style="width:110px; text-align:right;">Actions</div></div>
      <div id="coa-body"></div>
      <div id="coa-empty" class="text-muted-custom" style="display:none; padding:2rem; text-align:center;">No ledgers or groups match your search.</div>
    </div>
  </main>
</div>
<script src="assets/js/hardcode.js?v=12"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/api.js?v=52"></script>
<script src="assets/js/util.js?v=52"></script>
<script src="assets/js/entry-common.js"></script>
<script src="assets/js/drilldown.js?v=2"></script>
<script src="assets/js/shell.js?v=52"></script>
<script src="assets/js/page-accounts.js?v=3"></script>
</body></html>
