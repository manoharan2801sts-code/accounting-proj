<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Trial Balance — TRAVEL AGENCY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="assets/css/design-system.css" rel="stylesheet" />
  <link href="assets/css/app.css" rel="stylesheet" />
<link href="assets/css/loader.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <style>
    /* Locked to the viewport - only the grid's own body scrolls, with the
       Difference/Grand Total rows pinned to the bottom of that scroll
       area (not the whole page), same pattern as ticket-entry.html. */
    html, body { height: 100%; overflow: hidden; margin: 0; }
    .tb-main { display: flex; flex-direction: column; height: calc(100vh - var(--topnav-height) - var(--menubar-height, 0px)); box-sizing: border-box; }
    .tb-main .page-header-row { flex-shrink: 0; }
    .tb-main .table-container { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .tb-scroll-wrap { flex: 1; min-height: 0; overflow: auto; }
    .tb-table thead th { position: sticky; top: 0; z-index: 1; }
    /* Both footer rows get an explicit height so the Difference row's
       sticky "bottom" offset (= the Grand Total row's own height) is
       exact, not a guess - Grand Total pins to the very bottom, and
       Difference stacks directly above it. */
    .tb-table tfoot tr td { position: sticky; z-index: 1; height: 38px; box-sizing: border-box; }
    .tb-table tfoot tr.tb-diff-row td { bottom: 37px; }
    .tb-table tfoot tr.tb-grand-total-row td { bottom: 0; z-index: 2; }

    .page-header-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .page-title-group h1 { font-size: 1.25rem; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
    .page-title-group .breadcrumb { font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 0.25rem; display: flex; gap: 0.4rem; align-items: center; }

    .filter-group { display: flex; flex-direction: column; gap: 0.35rem; }

    /* A single compact toolbar row - date fields sized/aligned to match
       the plain Print/Export CSV buttons (no stacked label-above-input
       block, no 34px-tall oversized controls) so everything fits on one
       line instead of wrapping onto its own row underneath. */
    .tb-toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; width: 100%; }
    .tb-toolbar-label { font-size: 11px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em; }
    .tb-toolbar-date { height: 26px; width: 116px; padding: 0 6px; font-size: 12px; box-sizing: border-box; }
    .filter-group label { font-size: 11px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em; }

    .table-container { background: var(--color-white); border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
    .table-toolbar {
      padding: 0.5rem 1rem; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--color-border); gap: 1rem; flex-wrap: wrap; background: #FAFBFD;
    }
    .table-search { max-width: 220px; width: 100%; height: 26px; font-size: 11.5px; padding: 0 0.5rem; }

    .tb-table { width: 100%; border-collapse: collapse; text-align: left; }
    .tb-table th { padding: 0.35rem 0.8rem; background: #F8FAFC; border-bottom: 1px solid var(--color-border);
      font-size: 12.5px; font-weight: 700; color: var(--color-text-muted); letter-spacing: 0.03em; }
    .tb-table th.tb-amt { text-align: right; }
    .tb-table td { padding: 0.25rem 1rem; border-bottom: 1px solid var(--color-border-subtle); font-size: 13px; color: var(--color-text); vertical-align: middle; }
    .tb-table tbody tr:last-child td { border-bottom: none; }
    .tb-amt { font-family: var(--font-mono); font-weight: 600; text-align: right; white-space: nowrap; width: 140px; }

    /* "Group" rows (primary groups at top level, or any sub-group row,
       wherever it appears) are plain white/black-bold and are always
       clickable - drilling in via ?group_id=. "Ledger" rows stay plain
       white/italic and link straight to the Ledger report instead.
       Both turn solid blue with white text when hovered/keyboard-selected
       - driven purely by the .tb-row-selected class (kept in sync with
       real mouse position by a mouseover listener), not a native :hover
       rule, since combining the two let a stationary mouse's :hover and
       a keyboard-moved .tb-row-selected light up two rows at once. */
    .tb-group-row td { font-weight: 700; color: var(--color-text-dark); }
    .tb-group-row { cursor: pointer; }
    .tb-group-row.tb-row-selected td { background: var(--color-primary); color: #FFFFFF; }
    .tb-ledger-row { cursor: pointer; }
    .tb-ledger-row td:first-child { font-style: italic; color: var(--color-text-dark); }
    .tb-ledger-row.tb-row-selected td { background: var(--color-primary); color: #FFFFFF; }
    .tb-ledger-row.tb-row-selected td:first-child { color: #FFFFFF; }
    /* Only used in the top-level "Detailed View" - a group row's own
       immediate children, indented beneath it. */
    .tb-indent td:first-child { padding-left: 2rem; }
    .tb-diff-row td { font-weight: 700; font-style: italic; color: var(--color-text-dark); background: var(--color-primary-tint-strong); }
    .tb-diff-row:hover td { background: var(--color-primary); color: #FFFFFF; }
    .tb-grand-total-row td { border-top: none; font-weight: 800; font-size: 13.5px; background: #FAFBFD; }

    .tb-detailed-toggle { display: flex; align-items: center; gap: 0.5rem; font-size: 13px; color: var(--color-text-dark); cursor: pointer; user-select: none; }
    .tb-detailed-toggle input { width: 16px; height: 16px; cursor: pointer; }

    .tb-back-row { padding: 0.85rem 1.25rem; border-top: 1px solid var(--color-border); background: #FAFBFD; }
    .tb-back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 13px; font-weight: 600; color: var(--color-primary); text-decoration: none; cursor: pointer; }
    .tb-back-link:hover { text-decoration: underline; }

    th.amt-header { text-align: right; }
  </style>
</head>
<body>
<script src="assets/js/loader.js?v=2"></script>
  <header class="app-topnav" id="shell-topnav"></header>
  <div class="app-body">
    <main class="app-main tb-main" style="max-width: 1440px; margin: 0 auto; padding: 1.5rem 2rem; width: 100%;">
      <div class="page-header-row">
        <div class="tb-toolbar">
          <span class="tb-toolbar-label">From</span>
          <input type="date" class="form-control-custom tb-toolbar-date" id="filter-from" />
          <span class="tb-toolbar-label">To</span>
          <input type="date" class="form-control-custom tb-toolbar-date" id="filter-to" />
          <button type="button" class="dom-nav-btn btn-primary" onclick="loadTrialBalance()">Apply</button>
          <label class="tb-detailed-toggle" id="tb-detailed-toggle-wrap">
            <input type="checkbox" id="tb-detailed-view" checked onchange="loadTrialBalance()" />
            Detailed View
          </label>
          <span style="margin-left:auto;"></span>
          <button type="button" class="dom-nav-btn" onclick="window.print()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2m-12 0v4h12v-4"/></svg>
            Print
          </button>
          <button type="button" class="dom-nav-btn btn-primary" onclick="exportCSV()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4m14-7l-5 5-5-5m5 5V3"/></svg>
            Export CSV
          </button>
        </div>
      </div>

      <div class="table-container">
        <div class="table-toolbar">
          <div style="font-weight:700; font-size:0.78rem; color:var(--color-text-dark);" id="tb-title">Trial Balance</div>
          <input type="text" class="form-control-custom table-search" placeholder="Search records..." oninput="filterTable(this.value)" />
        </div>
        <div class="tb-scroll-wrap">
          <table class="tb-table" id="main-data-table">
            <thead>
              <tr>
                <th>Particulars</th>
                <th class="tb-amt">Debit</th>
                <th class="tb-amt">Credit</th>
              </tr>
            </thead>
            <tbody id="main-data-tbody">
              <tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">Loading...</td></tr>
            </tbody>
            <tfoot>
              <tr class="tb-diff-row" id="tb-diff-row" style="display:none;">
                <td>Difference (Opening/Closing Balances)</td>
                <td class="tb-amt" id="tb-diff-debit"></td>
                <td class="tb-amt" id="tb-diff-credit"></td>
              </tr>
              <tr class="tb-grand-total-row">
                <td>Grand Total</td>
                <td class="tb-amt" id="tb-grand-debit">0.00</td>
                <td class="tb-amt" id="tb-grand-credit">0.00</td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div class="tb-back-row" id="tb-back-row" style="display:none;">
          <a href="#" class="tb-back-link" id="tb-back-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            <span id="tb-back-label">Back</span>
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/hardcode.js"></script>
  <script src="assets/js/util.js"></script>
  <script src="assets/js/shell.js"></script>
  <script>
    // Not gated on DOMContentLoaded - this page's <script> can be injected
    // by the app's SPA navigation (shell.js's navigateTo) into a document
    // that already finished loading, so DOMContentLoaded never fires again
    // and this would silently never run except on a hard refresh.
    //
    // Wrapped in an IIFE (unlike a naive top-level script) because
    // shell.js re-executes this exact block every time this page is
    // navigated to - a second execution's top-level `let`/`const` in the
    // SAME document throws "Identifier has already been declared" (a
    // classic-script global lexical environment persists across separately
    // executed <script> tags), which silently aborts the whole block and
    // leaves the page stuck on its static "Loading..." forever until a
    // hard refresh starts the document fresh. Functions the page's own
    // onclick="..." attributes call are exposed on window explicitly,
    // since they're no longer implicitly global once wrapped.
    (function () {
    let activeCompanyId;
    let lastLoadedData = null;
    // The group currently being viewed (?group_id= in the URL) - null at
    // the plain top-level Trial Balance. Drilling in/out is just this
    // page re-fetching with a different group_id, never a real navigation
    // to a separate HTML file, so the from/to date filters and the
    // Detailed View checkbox stay put as you go up and down the hierarchy.
    let currentGroupId = new URLSearchParams(window.location.search).get("group_id") || null;

    (async function init() {
      try {
        const active = await VoyagerShell.init({ activeKey: "rep-trial-balance" });
        if (active) activeCompanyId = Number(active.id);
        await VoyagerUtil.loadDecimalPlaces(activeCompanyId);
      } catch (err) {
        console.error("Shell init failed", err);
      }
      setDefaultDates();
      await loadTrialBalance();
    })();

    // Defaults to today, not a wide range - this project posts a lot of
    // data per day, so a multi-week/FY-wide default window would be
    // slow/overwhelming to load on first open. (from_date is only
    // decorative in the header anyway - Closing Balance is always
    // cumulative-to-date, see trial_balance_report's own docstring.)
    function setDefaultDates() {
      const todayStr = new Date().toISOString().slice(0, 10);
      document.getElementById("filter-from").value = todayStr;
      document.getElementById("filter-to").value = todayStr;
    }

    function fmtAmt(n) {
      const v = Number(n) || 0;
      const d = VoyagerUtil.getDecimalPlaces();
      return v.toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    async function loadTrialBalance() {
      const tbody = document.getElementById("main-data-tbody");
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">Loading...</td></tr>`;

      const fromDate = document.getElementById("filter-from").value;
      const toDate = document.getElementById("filter-to").value;
      const detailed = document.getElementById("tb-detailed-view").checked;
      let params = `company_id=${activeCompanyId}`;
      if (fromDate) params += `&from_date=${fromDate}`;
      if (toDate) params += `&to_date=${toDate}`;
      if (currentGroupId) {
        params += `&group_id=${currentGroupId}`;
      } else if (detailed) {
        // Detailed View only means anything at the plain top level -
        // once drilled into a specific group, that group's own children
        // are always shown in full (there's no separate collapsed variant
        // of a drill-down page).
        params += `&detailed=1`;
      }
      // Detailed View has nothing to toggle once you've drilled into a
      // group - hide it there instead of leaving a checkbox that does
      // nothing.
      document.getElementById("tb-detailed-toggle-wrap").style.display = currentGroupId ? "none" : "";

      try {
        const res = await fetch(`${window.API_BASE || "/api"}/trial-balance/?${params}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Server returned ${res.status}`);
        lastLoadedData = data;

        document.getElementById("tb-title").textContent = data.context ? data.context.name : "Trial Balance";
        document.getElementById("tb-back-row").style.display = data.back ? "" : "none";
        if (data.back) document.getElementById("tb-back-label").textContent = `Back to ${data.back.label}`;

        renderTable(data);
      } catch (err) {
        console.error("Could not load the trial balance - is the Django backend running?", err);
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">Could not load data. Is the Django backend running on localhost:8000?</td></tr>`;
      }
    }

    // Keyboard row navigation - Up/Down moves a highlighted "current row"
    // (same look as mouse hover), Enter activates it exactly the same as
    // clicking it (drills into a group, or opens the ledger's statement).
    // Ignored while typing in any filter/search field so arrow keys there
    // still move the text cursor as normal.
    let selectedRowIndex = -1;
    function visibleDataRows() {
      return Array.from(document.querySelectorAll("#main-data-tbody tr.tb-group-row, #main-data-tbody tr.tb-ledger-row")).filter((r) => r.style.display !== "none");
    }
    function selectRow(index) {
      const rows = visibleDataRows();
      rows.forEach((r) => r.classList.remove("tb-row-selected"));
      if (!rows.length) { selectedRowIndex = -1; return; }
      selectedRowIndex = Math.max(0, Math.min(index, rows.length - 1));
      const row = rows[selectedRowIndex];
      row.classList.add("tb-row-selected");
      row.scrollIntoView({ block: "nearest" });
    }
    // Keeps the keyboard-selected row in sync with whatever the mouse is
    // actually over - without this, moving the mouse to hover a different
    // row while an old keyboard selection is still stuck elsewhere made it
    // look like hover had stopped working (two rows lit up at once).
    document.getElementById("main-data-tbody").addEventListener("mouseover", (e) => {
      const row = e.target.closest("tr.tb-group-row, tr.tb-ledger-row");
      if (!row) return;
      const idx = visibleDataRows().indexOf(row);
      if (idx !== -1) selectRow(idx);
    });
    document.addEventListener("keydown", (e) => {
      if (!["ArrowDown", "ArrowUp", "Enter"].includes(e.key)) return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (["INPUT", "SELECT", "TEXTAREA"].includes(tag)) return;
      const rows = visibleDataRows();
      if (!rows.length) return;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        selectRow(selectedRowIndex < rows.length - 1 ? selectedRowIndex + 1 : 0);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        selectRow(selectedRowIndex > 0 ? selectedRowIndex - 1 : rows.length - 1);
      } else if (e.key === "Enter" && selectedRowIndex >= 0) {
        e.preventDefault();
        rows[selectedRowIndex].click();
      }
    });

    function rowHtml(row, indent) {
      const isLedger = row.type === "ledger";
      const cls = (isLedger ? "tb-ledger-row" : "tb-group-row") + (indent ? " tb-indent" : "");
      const attrs = isLedger ? `data-ledger-id="${row.id}" title="Click to view this ledger's statement"`
        : `data-group-id="${row.id}" title="Click to view this group's breakdown"`;
      return `
        <tr class="${cls}" ${attrs}>
          <td>${row.name}</td>
          <td class="tb-amt">${row.debit ? fmtAmt(row.debit) : ""}</td>
          <td class="tb-amt">${row.credit ? fmtAmt(row.credit) : ""}</td>
        </tr>`;
    }

    // Grand Total always shows the SAME (balanced) figure on both sides,
    // like Tally's own Trial Balance - whichever side (Debit or Credit)
    // actually totalled less gets that shortfall shown on its own
    // Difference row just above, so Grand Total itself never shows an
    // unbalanced pair of numbers.
    function renderTotals(totalDebit, totalCredit) {
      const diff = Math.round((totalDebit - totalCredit) * 100) / 100;
      const diffRow = document.getElementById("tb-diff-row");
      if (diff === 0) {
        diffRow.style.display = "none";
        document.getElementById("tb-diff-debit").textContent = "";
        document.getElementById("tb-diff-credit").textContent = "";
      } else {
        diffRow.style.display = "";
        document.getElementById("tb-diff-debit").textContent = diff < 0 ? fmtAmt(-diff) : "";
        document.getElementById("tb-diff-credit").textContent = diff > 0 ? fmtAmt(diff) : "";
      }
      const grand = Math.max(totalDebit, totalCredit);
      document.getElementById("tb-grand-debit").textContent = fmtAmt(grand);
      document.getElementById("tb-grand-credit").textContent = fmtAmt(grand);
    }

    function renderTable(data) {
      const tbody = document.getElementById("main-data-tbody");
      selectedRowIndex = -1; // stale after a full re-render - rows are new DOM nodes
      if (!data.rows.length) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:2rem; color:var(--color-text-muted);">No ledger balances found for this period.</td></tr>`;
        renderTotals(0, 0);
        return;
      }

      let rows = "";
      data.rows.forEach((row) => {
        rows += rowHtml(row, false);
        (row.children || []).forEach((c) => { rows += rowHtml(c, true); });
      });
      tbody.innerHTML = rows;

      tbody.querySelectorAll(".tb-ledger-row").forEach((row) => {
        row.addEventListener("click", () => {
          const from = encodeURIComponent("Trial Balance");
          const fromUrl = encodeURIComponent(window.location.href);
          window.location.href = `report-ledger-monthly.html?ledger_id=${row.dataset.ledgerId}&from=${from}&from_url=${fromUrl}`;
        });
      });
      tbody.querySelectorAll(".tb-group-row").forEach((row) => {
        row.addEventListener("click", () => {
          currentGroupId = row.dataset.groupId;
          const url = new URL(window.location.href);
          url.searchParams.set("group_id", currentGroupId);
          window.history.pushState({}, "", url);
          loadTrialBalance();
        });
      });

      renderTotals(data.total_debit, data.total_credit);
    }

    document.getElementById("tb-back-link").addEventListener("click", (e) => {
      e.preventDefault();
      const back = lastLoadedData && lastLoadedData.back;
      currentGroupId = back ? back.group_id : null;
      const url = new URL(window.location.href);
      if (currentGroupId) url.searchParams.set("group_id", currentGroupId);
      else url.searchParams.delete("group_id");
      window.history.pushState({}, "", url);
      loadTrialBalance();
    });

    function filterTable(query) {
      const q = query.toLowerCase();
      const rows = document.querySelectorAll("#main-data-table tbody tr");
      rows.forEach((r) => {
        r.style.display = r.textContent.toLowerCase().includes(q) ? "" : "none";
      });
    }

    function exportCSV() {
      let csv = [];
      const rows = document.querySelectorAll("#main-data-table tr");
      rows.forEach((row) => {
        let cols = Array.from(row.querySelectorAll("th, td")).map((td) => `"${td.innerText.replace(/"/g, '""')}"`);
        csv.push(cols.join(","));
      });
      const blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "trial-balance.csv";
      link.click();
    }

    // Called from onclick="..." attributes above, which always run in the
    // real global scope regardless of this IIFE.
    window.exportCSV = exportCSV;
    window.loadTrialBalance = loadTrialBalance;
    window.filterTable = filterTable;
    })();
  </script>
</body>
</html>
